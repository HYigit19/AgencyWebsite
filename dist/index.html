<title>Nexvio</title>

<main class="wrap chooser">

<script>
(function () {
  var pref = null;
  try { pref = localStorage.getItem("nexvio-lang"); } catch (e) {}
  var nav = (navigator.language || "de").slice(0, 2).toLowerCase();
  var lang = pref || (nav === "de" ? "de" : "en");
  location.replace(lang === "en" ? "/en/" : "/de/");
})();
</script>
