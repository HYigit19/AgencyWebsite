<style>
/* Layout: Navigation links (farbige Kacheln), Inhalt in der Mitte; Startseite und Listen breit, Detail mit Seitenspalte.
   Themes: data-skin (bunt | klar) × data-mode (auto | light | dark) × data-density (normal | kompakt); Firmenfarbe setzt --accent per Script. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --line: #E4E6EC;
  --ink: #17181C;
  --ink-2: #5F616B;
  --accent: #3450D1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFC;
  --wf: #5A4FCF; --wf-soft: #ECEBFB;
  --kr: #0B7A71; --kr-soft: #DFF1EE;
  --lr: #B4540A; --lr-soft: #FBEBDD;
  --good: #1D7445; --good-soft: #DDF1E4;
  --warn: #8F5300; --warn-soft: #FCEBCB;
  --crit: #B42331; --crit-soft: #FBE3E5;
  --info: #2459C4; --info-soft: #E2EAFA;
  --muted-soft: #EEEFF3;
  --bar: #A9B4C4;
  --col-over: #D93644; --col-over-ink: #FFFFFF;
  --col-today: #F4B23F; --col-today-ink: #3A2600;
  --col-week: #2F6FD6; --col-week-ink: #FFFFFF;
  --col-good: #1F8A55; --col-good-ink: #FFFFFF;
  --col-info: #2F6FD6; --col-info-ink: #FFFFFF;
  --col-warn: #F4B23F; --col-warn-ink: #3A2600;
  --col-accent: var(--accent); --col-accent-ink: var(--accent-ink);
  --col-crit: #D93644; --col-crit-ink: #FFFFFF;
  --n-start: var(--accent); --n-wf: var(--wf); --n-kr: var(--kr); --n-lr: var(--lr); --n-aufg: #2F6FD6; --n-md: #7E8496; --n-up: #7E8496; --n-theme: #B8458C;
  --nav-on: var(--surface);
  --a0: #0B7A71; --a1: #5A4FCF; --a2: #B4540A; --a3: #8A3FAE; --a4: #2A6FB0; --a5: #B23355; --a6: #4E7A1E; --a7: #5D6470;
  --card-border: 1px solid var(--line);
  --card-shadow: none;
  --radius: 12px;
  --head-w: 650;
  --scrim: rgba(13, 18, 28, .45);
  --shadow: 0 12px 32px rgba(13, 25, 45, .16);
  --font-d: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-m: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
:root[data-skin="bunt"] {
  --bg: #F3F4FA;
  --line: #E4E6F0;
  --ink: #1C1D2B;
  --ink-2: #5C5F74;
  --accent: #6E4AF2;
  --accent-soft: #EFEBFE;
  --wf: #6E4AF2; --wf-soft: #EFEBFE;
  --kr: #0B7A71; --kr-soft: #DDF1EE;
  --lr: #B94F06; --lr-soft: #FBE8DA;
  --muted-soft: #EEF0F7;
  --nav-on: var(--accent-soft);
  --card-border: 1px solid transparent;
  --card-shadow: 0 1px 3px rgba(28, 29, 43, .08), 0 0 0 1px rgba(28, 29, 43, .03);
  --radius: 16px;
  --head-w: 800;
  --font-d: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Dunkel: ausdrücklich gewählt, oder Automatisch und Gerät bzw. Viewer steht auf dunkel */
:root[data-mode="dark"], :root[data-mode="auto"][data-theme="dark"] {
  --bg: #0F1117; --surface: #181B24; --surface-2: #1F2330; --line: #2C3141; --ink: #E8EAF2; --ink-2: #A0A6B8;
  --accent: #7D97F5; --accent-ink: #0B1020; --accent-soft: #1E2748;
  --wf: #A59BF5; --wf-soft: #27244A; --kr: #45C2B4; --kr-soft: #123632; --lr: #F2A36A; --lr-soft: #3A2414;
  --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744;
  --muted-soft: #252A38; --bar: #47536A; --nav-on: var(--surface-2);
  --card-border: 1px solid var(--line); --card-shadow: none;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
  color-scheme: dark;
}
:root[data-mode="dark"][data-skin="bunt"], :root[data-mode="auto"][data-theme="dark"][data-skin="bunt"] { --accent: #A08BFF; --accent-soft: #2A2350; --wf: #A08BFF; --nav-on: var(--accent-soft); }
@media (prefers-color-scheme: dark) {
  :root[data-mode="auto"]:not([data-theme="light"]) {
    --bg: #0F1117; --surface: #181B24; --surface-2: #1F2330; --line: #2C3141; --ink: #E8EAF2; --ink-2: #A0A6B8;
    --accent: #7D97F5; --accent-ink: #0B1020; --accent-soft: #1E2748;
    --wf: #A59BF5; --wf-soft: #27244A; --kr: #45C2B4; --kr-soft: #123632; --lr: #F2A36A; --lr-soft: #3A2414;
    --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744;
    --muted-soft: #252A38; --bar: #47536A; --nav-on: var(--surface-2);
    --card-border: 1px solid var(--line); --card-shadow: none;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
    --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
    color-scheme: dark;
  }
  :root[data-mode="auto"]:not([data-theme="light"])[data-skin="bunt"] { --accent: #A08BFF; --accent-soft: #2A2350; --wf: #A08BFF; --nav-on: var(--accent-soft); }
}
* { box-sizing: border-box; }

[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-d); text-wrap: balance; margin: 0; font-weight: var(--head-w); letter-spacing: -.01em; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 20px; height: 20px; flex: none; }
.i.s { width: 16px; height: 16px; }
.mono { font-family: var(--font-m); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Rahmen */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1040px); gap: 24px; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 3px; padding-block: 16px; overflow-y: auto; }
.center { min-width: 0; padding-block: 18px 64px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; font-size: 18px; flex: none; }
.brand-name { font-family: var(--font-d); font-weight: 800; font-size: 18px; line-height: 1.05; }
.brand-sub { font-size: 11.5px; color: var(--ink-2); }
.nav-i { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 12px; font-weight: 600; font-size: 14.5px; color: var(--ink); text-align: left; position: relative; }
.nav-i:hover { background: var(--surface); }
.nav-i.on { background: var(--nav-on); }
.nav-i .ni { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--ni); color: #FFFFFF; flex: none; }
.nav-i .ni .i { width: 16px; height: 16px; }
.nav-i .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt { font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--muted-soft); color: var(--ink-2); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.cnt.crit { background: var(--crit); color: #fff; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.me-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.me-card select { border: 0; background: none; font-weight: 700; width: 100%; min-width: 0; padding: 0; }
.me-card small { display: block; color: var(--ink-2); font-size: 12px; }
.me-card > div { min-width: 0; flex: 1; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; text-align: left; }
.rail-foot .linkbtn { padding: 0 12px; font-size: 12px; }
.badge { position: absolute; top: 4px; left: 26px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.mtop { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mtop .brand { padding: 0; margin-right: auto; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; padding: 0; }
.icon-btn .badge { top: -5px; left: auto; right: -5px; }
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); justify-content: space-around; }
.tab-i { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); padding: 4px 6px; border-radius: 10px; flex: 1; position: relative; min-width: 0; }
.tab-i.on { color: var(--accent); }
.tab-i .cnt { position: absolute; top: -2px; right: calc(50% - 22px); min-width: 17px; height: 17px; font-size: 10.5px; }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mtop { display: flex; }
  .tabbar { display: flex; }
  .center { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* Bausteine */
.card { background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 16px; }
.card-h p { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 27px; line-height: 1.15; letter-spacing: -.02em; }
.page-h p { margin-top: 4px; color: var(--ink-2); max-width: 66ch; }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.good { color: var(--good); border-color: var(--good); }
.btn.big { padding: 13px 20px; font-size: 15.5px; border-radius: 12px; font-weight: 800; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn .i { width: 16px; height: 16px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.mini:hover { background: var(--surface-2); }
.mini.acc { color: var(--accent); border-color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.muted { background: var(--muted-soft); color: var(--ink-2); }
.hint { font-size: 13px; color: var(--ink-2); }
.empty { padding: 26px 16px; color: var(--ink-2); text-align: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--muted-soft); color: var(--ink-2); white-space: nowrap; }
.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 10px; font-size: 13px; max-width: 100%; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; background: var(--surface); flex: 1 1 220px; min-width: 0; }
.search input { border: 0; background: none; padding: 8px 0; width: 100%; min-width: 0; outline: none; }
.search:focus-within { border-color: var(--accent); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; letter-spacing: .02em; }
.av.s { width: 28px; height: 28px; font-size: 11px; }
.av.xs { width: 22px; height: 22px; font-size: 9.5px; }
.av.c0 { background: var(--a0); } .av.c1 { background: var(--a1); } .av.c2 { background: var(--a2); } .av.c3 { background: var(--a3); }
.av.c4 { background: var(--a4); } .av.c5 { background: var(--a5); } .av.c6 { background: var(--a6); } .av.c7 { background: var(--a7); }
.who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Formulare, Tabellen */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); width: 100%; min-width: 0; }
.field textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.field .help { font-size: 12px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.checks input { margin: 0; accent-color: var(--accent); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 16px; }
th:last-child, td:last-child { padding-right: 16px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); padding: 12px 14px; text-align: left; color: var(--ink); width: 100%; }
button.kpi:hover { box-shadow: 0 0 0 2px var(--accent-soft), var(--card-shadow); }
.kpi-l { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.kpi-v { font-family: var(--font-d); font-weight: 800; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-v.crit { color: var(--crit); } .kpi-v.warn { color: var(--warn); } .kpi-v.good { color: var(--good); }
.kpi-s { font-size: 12px; color: var(--ink-2); }

/* Start */
.hello { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hello h1 { font-size: 29px; letter-spacing: -.02em; }
.hello p { margin-top: 3px; color: var(--ink-2); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.qbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 13.5px; color: #FFFFFF; background: var(--qc); }
.qbtn .i { width: 16px; height: 16px; }

  --col-over: #F43F5E; --col-over-ink: #fff; --col-today: #F59E0B; --col-today-ink: #fff; --col-week: #0EA5E9; --col-week-ink: #fff;
  --col-good: #10B981; --col-good-ink: #fff; --col-info: #0EA5E9; --col-info-ink: #fff; --col-warn: #F59E0B; --col-warn-ink: #fff;
  --wf: #7C3AED; --kr: #0E9F88; --lr: #EA580C; --n-theme: #DB2777; --n-aufg: #0284C7; --n-md: #64748B;
  --a0: #0E9F88; --a1: #7C3AED; --a2: #EA580C; --a3: #DB2777; --a4: #0284C7; --a5: #E11D48; --a6: #65A30D; --a7: #64748B;
  --card-border: 0; --card-shadow: var(--dvx-shadow); --radius: 20px; --head-w: 800;
  --shadow: 0 24px 60px -16px rgba(16, 24, 40, .28);
  --font-d: var(--dvx-font); --font-b: var(--dvx-font);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
body { background: var(--bg); font-family: var(--dvx-font); color: var(--ink); }
body::before { background: var(--bg); }
h1, h2, h3 { letter-spacing: -.02em; }

/* ---------- Rahmen ---------- */
.shell { grid-template-columns: 252px minmax(0, 1fr); gap: 28px; max-width: 1500px; margin: 0 auto; justify-content: stretch; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.mainc { min-width: 0; display: flex; flex-direction: column; }
.center { padding-block: 6px 64px; gap: 20px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 0 12px; min-height: 70px; }
.tb-l { flex: 1; min-width: 0; color: var(--ink-2); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tb-l .crumb { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.05); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tb-date { white-space: nowrap; }
.tb-l .crumb i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
.tb-r { display: flex; align-items: center; gap: 10px; flex: none; }
.tools-host { display: inline-flex; align-items: center; gap: 10px; }
.tools-host .dvx-lang { background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06), inset 0 0 0 1px var(--line); }
.tools-host .dvx-lang button[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: none; }
.tb-btns { display: inline-flex; gap: 8px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; border: 0; background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06), inset 0 0 0 1px var(--line); color: var(--ink); transition: transform .15s var(--ease), box-shadow .15s; }
.icon-btn:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 6px 16px -6px rgba(16,24,40,.2), inset 0 0 0 1px var(--line); }
.icon-btn .badge { top: -4px; right: -4px; left: auto; background: var(--crit); box-shadow: 0 0 0 2px #fff; }

/* Sidebar: schwebendes Panel mit Akzent-Verlauf */
.rail { top: 14px; height: calc(100vh - 28px); margin-block: 14px; padding: 18px 12px 14px; gap: 2px; border-radius: 24px; color: #fff;
  background: radial-gradient(130% 55% at 100% 0%, rgba(45, 212, 191, .55), transparent 62%), radial-gradient(90% 40% at 0% 100%, rgba(45, 212, 191, .35), transparent 70%), linear-gradient(165deg, #0E9F88 0%, #0B8A76 55%, #08705F 100%);
  box-shadow: 0 20px 44px -18px rgba(8, 112, 95, .55); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }
.rail .brand { padding: 2px 8px 18px; }
.rail .logo { background: #fff; color: var(--accent); box-shadow: 0 6px 14px -6px rgba(0,0,0,.35); border-radius: 12px; }
.rail .brand-name { color: #fff; font-size: 17px; letter-spacing: -.01em; }
.rail .brand-sub { color: rgba(255,255,255,.78); font-weight: 600; }
.rail .nav-i { color: rgba(255,255,255,.92); padding: 8px 10px; border-radius: 14px; font-size: 14px; transition: background .18s, color .18s, transform .18s var(--ease); }
.rail .nav-i .ni { background: rgba(255,255,255,.14); color: #fff; width: 32px; height: 32px; border-radius: 10px; transition: background .18s, color .18s; }
.rail .nav-i:hover { background: rgba(255,255,255,.12); }
.rail .nav-i.on { background: #fff; color: var(--accent-deep); box-shadow: 0 8px 20px -10px rgba(0,0,0,.35); }
.rail .nav-i.on .ni { background: var(--accent-soft); color: var(--accent-deep); }
.rail .cnt { background: rgba(255,255,255,.22); color: #fff; }
.rail .cnt.crit { background: rgba(255,255,255,.95); color: #E11D48; }
.rail .nav-i.on .cnt { background: var(--accent-soft); color: var(--accent-deep); }
.rail .nav-i.on .cnt.crit { background: #FFE4E6; color: #E11D48; }
.rail .nav-sep { background: rgba(255,255,255,.18); margin: 10px 10px; }
.rail .nav-cap { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.62); padding: 6px 12px 4px; }
.rail-foot { gap: 10px; }
.rail .me-card { background: rgba(255,255,255,.14); border: 0; border-radius: 16px; color: #fff; padding: 10px; cursor: pointer; transition: background .18s; }
.rail .me-card:hover { background: rgba(255,255,255,.2); }
.rail .me-card select { color: #fff; background: transparent; font-weight: 800; cursor: pointer; appearance: none; -webkit-appearance: none; text-overflow: ellipsis; }
.rail .me-card select option, .rail .me-card select optgroup { color: var(--ink); background: #fff; }
.rail .me-card small { color: rgba(255,255,255,.78); }
.rail .me-card .chev { width: 16px; height: 16px; opacity: .8; flex: none; }
.rail .me-card .av { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.rail-foot .linkbtn { color: rgba(255,255,255,.85); padding: 2px 12px; font-size: 12.5px; }
.rail-foot .linkbtn:hover { color: #fff; }
.rail .me-card:focus-within { outline: 2px solid #fff; outline-offset: 2px; }
.rail :focus-visible { outline-color: #fff; }

/* ---------- Bausteine ---------- */
.card { border-radius: var(--radius); box-shadow: var(--card-shadow); border: 0; transition: box-shadow .2s, transform .2s var(--ease); }
.card-h { border-bottom: 1px solid var(--line); padding: 16px 20px; }
.card-h h2 { font-size: 16.5px; font-weight: 800; }
.card-b { padding: 16px 20px; }
.page-h h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.page-h p { font-size: 14px; }
.btn { border-radius: 12px; padding: 9px 16px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(16,24,40,.05); font-weight: 700; transition: transform .15s var(--ease), box-shadow .15s, background .15s; min-height: 40px; }
.btn:hover { background: #fff; transform: translateY(-1px); box-shadow: inset 0 0 0 1px #D5DCE5, 0 6px 14px -6px rgba(16,24,40,.18); }
.btn.primary { background: linear-gradient(135deg, var(--accent), #14B8A6); color: #fff; box-shadow: 0 8px 18px -8px rgba(14,159,136,.7); }
.btn.primary:hover { filter: none; box-shadow: 0 12px 24px -10px rgba(14,159,136,.75); }
.btn.danger { color: var(--crit); box-shadow: inset 0 0 0 1px #FECDD3; }
.btn.danger:hover { background: var(--crit-soft); }
.btn[disabled], .btn[disabled]:hover { opacity: .45; transform: none; box-shadow: inset 0 0 0 1px var(--line); }
.btn.primary[disabled] { box-shadow: none; }
.mini { border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 10px; padding: 6px 11px; font-weight: 700; transition: background .15s; }
.mini.acc { color: var(--accent-deep); background: var(--accent-soft); box-shadow: none; }
.mini.acc:hover { background: #C8EFE7; }
.pill { font-weight: 700; padding: 3px 10px; }
.pill.accent { background: var(--accent-soft); color: var(--accent-deep); }
.chip { border: 0; box-shadow: inset 0 0 0 1px var(--line); padding: 8px 14px; min-height: 38px; }
.chip.on { background: var(--accent); color: #fff; box-shadow: none; }
.chip.on:hover { color: #fff; }
.sel, .search { border: 0; box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(16,24,40,.04); background: #fff; min-height: 40px; padding-inline: 14px; }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.tag { border-radius: 8px; background: var(--muted-soft); color: #475069; font-weight: 700; }
.linkbtn { color: var(--accent-deep); font-weight: 700; }
.empty { padding: 34px 16px; }
.col-empty { border: 0; background: rgba(255,255,255,.6); border-radius: 16px; box-shadow: inset 0 0 0 1.5px var(--line); padding: 22px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.col-empty svg { width: 22px; height: 22px; color: var(--good); }
th { color: #8A91A6; font-weight: 700; font-size: 10.5px; letter-spacing: .08em; border-bottom: 1px solid var(--line); padding: 12px 10px; }
td { border-bottom: 1px solid #F0F3F6; padding: 11px 10px; }
th:first-child, td:first-child { padding-left: 20px; }
th:last-child, td:last-child { padding-right: 20px; }
tbody tr:last-child td { border-bottom: 0; }
tr.click td { transition: background .15s; }
tr.click:hover td { background: #F6FAF9; }
.field label, .field .lbl { font-weight: 700; color: #4B5368; }
.field input, .field select, .field textarea { border: 0; box-shadow: inset 0 0 0 1px #DDE3EA; border-radius: 12px; padding: 10px 12px; background: #fff; transition: box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.field input[type=checkbox], .field input[type=radio] { width: auto; padding: 0; box-shadow: none; border-radius: 4px; min-height: 0; accent-color: var(--accent); }
.rail .nav-i .lbl { white-space: normal; line-height: 1.2; overflow: visible; }
.field input[disabled], .field select[disabled], .field textarea[disabled] { background: var(--surface-2); color: var(--ink-2); }
.checks label { border: 0; box-shadow: inset 0 0 0 1px #DDE3EA; padding: 7px 12px; min-height: 38px; transition: background .15s, box-shadow .15s; }
.checks label:has(input:checked) { background: var(--accent-soft); color: var(--accent-deep); box-shadow: inset 0 0 0 1.5px var(--accent); }
.av { box-shadow: 0 0 0 2px #fff; }
.av-stack .av { border: 0; margin-left: -6px; }
.dpill { font-weight: 700; }
.dpill.week { background: var(--info-soft); color: var(--info); }
.dpill.acc { background: var(--lila-soft); color: var(--lila); }
.apill { border-radius: 8px; font-weight: 800; padding: 3px 9px; color: var(--qc); background: color-mix(in srgb, var(--qc) 13%, #fff); }
.apill.t1 { --qc: #7C3AED; } .apill.t2 { --qc: #0E9F88; } .apill.t3 { --qc: #EA580C; } .apill.t4 { --qc: #DB2777; } .apill.t5 { --qc: #0284C7; }
.risk { border-radius: 8px; padding: 2px 8px; }
.risk.hoch { background: var(--crit-soft); color: var(--crit); } .risk.mittel { background: var(--warn-soft); color: var(--warn); } .risk.gering { background: var(--info-soft); color: var(--info); }
.bcard { border: 0; border-radius: 18px; box-shadow: var(--card-shadow); padding: 14px 16px; transition: transform .18s var(--ease), box-shadow .18s; }
button.bcard:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(16,24,40,.05), 0 18px 36px -12px rgba(16,24,40,.2); }
.bc-t { font-weight: 800; font-size: 14.5px; }
.kpi, .kpi2 { border: 0; }
.dot.ok { background: var(--col-good); } .dot.soon { background: var(--col-today); } .dot.over { background: var(--col-over); } .dot.nie { border: 2px dashed #94A3B8; }

/* Spaltenköpfe: Pastell statt Vollfarbe */
.col-h { border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 800; }
.col-h > span:last-child { min-width: 26px; height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,.75); display: inline-grid; place-items: center; font-size: 12px; }
.col-h.over, .board .col-h.over { background: #FFE4E6; color: #BE123C; }
.col-h.today, .board .col-h.warn { background: #FEF3C7; color: #B45309; }
.col-h.week, .board .col-h.info { background: #E0F2FE; color: #0369A1; }
.col-h.good, .board .col-h.good { background: #DCFCE7; color: #15803D; }
.board .col-h.accent { background: #EDE9FE; color: #6D28D9; }
.col-more { border: 0; background: none; color: var(--accent-deep); font-weight: 700; font-size: 13px; padding: 8px; border-radius: 12px; }
.col-more:hover { background: rgba(14,159,136,.08); }

/* ---------- Start-Dashboard ---------- */
.hello { align-items: flex-end; }
.hello h1 { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.hello p { font-weight: 600; }
.hello .wave { display: inline-block; }
.quick { gap: 8px; }
.qbtn { border-radius: 14px; padding: 10px 15px; min-height: 42px; color: var(--qc); background: #fff; box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px rgba(16,24,40,.05); transition: transform .15s var(--ease), box-shadow .15s; }
.qbtn .qi { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--qc) 14%, #fff); }
.qbtn span.qt { color: var(--ink); }
.qbtn:hover { filter: none; transform: translateY(-1px); box-shadow: inset 0 0 0 1px #D5DCE5, 0 8px 18px -8px rgba(16,24,40,.22); }
.qbtn.q0 { --qc: #fff; background: linear-gradient(135deg, var(--accent), #14B8A6); box-shadow: 0 8px 18px -8px rgba(14,159,136,.7); }
.qbtn.q0 span.qt { color: #fff; } .qbtn.q0 .qi { background: rgba(255,255,255,.2); }
.qbtn.q1 { --qc: #0284C7; } .qbtn.q2 { --qc: #0E9F88; } .qbtn.q3 { --qc: #EA580C; } .qbtn.q4 { --qc: #7C3AED; }
.dash-a { display: grid; grid-template-columns: minmax(270px, 1fr) minmax(0, 2fr); gap: 20px; align-items: stretch; }
.dash-c { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 20px; align-items: stretch; }
.gauge-card { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; }
.ch-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ch-h h2 { font-size: 16px; font-weight: 800; }
.ch-h p { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.g-wrap { display: grid; place-items: center; margin-top: 4px; position: relative; }
.g-wrap svg { width: min(250px, 100%); height: auto; }
.g-val { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-top: -4px; font-variant-numeric: tabular-nums; }
.g-sub { text-align: center; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.g-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.g-split > div { background: var(--surface-2); border-radius: 14px; padding: 9px 12px; }
.g-split b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.g-split small { color: var(--ink-2); font-weight: 600; font-size: 11.5px; }
.g-split i { display: block; height: 5px; border-radius: 9px; background: #E3E8EE; margin-top: 6px; overflow: hidden; }
.g-split i > u { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.kpi2 { background: #fff; border-radius: 20px; box-shadow: var(--card-shadow); padding: 16px 18px; text-align: left; color: var(--ink); width: 100%; display: flex; flex-direction: column; gap: 4px; justify-content: space-between; transition: transform .18s var(--ease), box-shadow .18s; min-width: 0; }
.kpi2:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(16,24,40,.05), 0 18px 36px -12px rgba(16,24,40,.2); }
.k-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.k-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--kc-s); color: var(--kc); flex: none; }
.k-ic .i { width: 20px; height: 20px; }
.kc-rose { --kc: #E11D48; --kc-s: #FFE4E6; } .kc-peach { --kc: #EA580C; --kc-s: #FFEDD5; } .kc-amber { --kc: #D97706; --kc-s: #FEF3C7; } .kc-lila { --kc: #7C3AED; --kc-s: #EDE9FE; } .kc-sky { --kc: #0284C7; --kc-s: #E0F2FE; } .kc-mint { --kc: #16A34A; --kc-s: #DCFCE7; }
.trend { font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.trend.up { background: #DCFCE7; color: #15803D; } .trend.down { background: #FFE4E6; color: #BE123C; } .trend.flat { background: var(--muted-soft); color: var(--ink-2); }
.k-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.k-v { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.k-l { font-size: 13px; font-weight: 700; color: #3B4256; }
.k-s { font-size: 12px; color: var(--ink-2); }
.mbars { display: flex; align-items: flex-end; gap: 4px; height: 46px; flex: none; }
.mbars i { width: 8px; border-radius: 3px; background: var(--kc-s); }
.mbars i:last-child { background: var(--kc); }
.focus { background: radial-gradient(120% 140% at 100% 0%, rgba(45,212,191,.55), transparent 55%), linear-gradient(120deg, #0B8A76, #0E9F88 60%, #14B8A6); color: #fff; border-radius: 22px; padding: 18px 22px; box-shadow: 0 18px 36px -18px rgba(8,112,95,.6); }
.focus-n { background: rgba(255,255,255,.18); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); font-size: 26px; }
.focus-t b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.focus-t span { opacity: .9; }
.focus .btn { background: #fff; color: var(--accent-deep); box-shadow: 0 8px 18px -8px rgba(0,0,0,.35); padding: 11px 20px; font-weight: 800; }
.focus .btn:hover { background: #fff; box-shadow: 0 12px 24px -10px rgba(0,0,0,.4); }
.focus.calm { background: linear-gradient(120deg, #DCFCE7, #ECFDF5); color: #15803D; box-shadow: var(--card-shadow); }
.focus.calm .focus-n { background: #16A34A; color: #fff; box-shadow: none; }
.focus.calm .btn { color: #15803D; }
.chart-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chart-card .dvx-bars { width: 100%; height: auto; display: block; }
.chart-card .dvx-axis { font-family: var(--dvx-font); }
.lgd { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.lgd span { display: inline-flex; align-items: center; gap: 6px; }
.lgd i { width: 10px; height: 10px; border-radius: 4px; display: inline-block; }
.donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; justify-content: center; flex: 1; }
.donut-wrap .dvx-donut { flex: none; }
.dl2 { display: flex; flex-direction: column; gap: 8px; flex: 1 1 140px; min-width: 0; max-width: 380px; }
.dl2 button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: 12.5px; line-height: 1.2; color: var(--ink); text-align: left; transition: background .15s; min-height: 40px; }
.dl2 button:hover { background: #EAF0F4; }
.dl2 i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dl2 b { margin-left: auto; font-variant-numeric: tabular-nums; }
.rings { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 1381px) { .rings { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.ring-i { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border: 0; background: var(--surface-2); border-radius: 16px; text-align: center; color: var(--ink); transition: transform .18s var(--ease), background .18s, box-shadow .18s; min-width: 0; }
.ring-i:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 12px 26px -12px rgba(16,24,40,.25); }
.ring-i b { font-size: 12.5px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.ring-i small { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.ring-i .dvx-ring-v { font-family: var(--dvx-font); font-weight: 800; fill: var(--ink); }
.cols3 { gap: 20px; }

/* Matrix */
.mx thead th { background: #fff; }
.mx tbody th { background: #fff; border-right: 1px solid var(--line); }
.mx tbody tr:hover th, .mx tbody tr:hover td { background: #F6FAF9; }
.mx .th-r { color: #3B4256; font-weight: 800; max-height: 152px; }
.mx thead th { height: 160px; }

let PAD = null;
function sigPad(canvasId, onChange, init, onEnd) {

  c.addEventListener('pointerdown', e => { down = true; last = pt(e); try { c.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); });

  pad.clear = () => { if (g) g.clearRect(0, 0, c.width, c.height); pad.drawn = false; onChange && onChange(false); onEnd && onEnd(); };
  pad.data = () => { if (!g || !pad.drawn) return null; try { const o = document.createElement('canvas'); o.width = c.width; o.height = c.height; const og = o.getContext('2d'); og.fillStyle = '#fff'; og.fillRect(0, 0, o.width, o.height); og.drawImage(c, 0, 0); return o.toDataURL('image/png'); } catch (e) { return null; } };

/* Behördenmappe */
const MZ = { bg: 'Berufsgenossenschaft', amt: 'Amt für Arbeitsschutz', iso: 'Zertifizierungsaudit ISO 45001' };
function period() {
  const y = new Date().getFullYear();
  if (S.mp === 'kj') return { von: `${y}-01-01`, bis: TODAY, l: `Kalenderjahr ${y}` };
  if (S.mp === 'vj') return { von: `${y - 1}-01-01`, bis: `${y - 1}-12-31`, l: `Vorjahr ${y - 1}` };
  return { von: addMonths(TODAY, -12), bis: TODAY, l: 'Letzte 12 Monate' };
}
function checklist() {
  const st = stats(), pr = period();
  const neu = S.people.filter(p => daysBetween(p.eintritt, TODAY) <= 365);
  const erstOk = neu.filter(p => { const n = lastN(p.id, 'erst'); return n && n.datum <= addDays(p.eintritt, 1); }).length;
  const tIn = S.termine.filter(x => x.status === 'abgeschlossen' && x.datum >= pr.von && x.datum <= pr.bis);
  const tSig = tIn.filter(x => Object.values(x.anw).every(v => v && v !== true)).length;
  const aIn = S.audits.filter(a => a.status === 'abgeschlossen' && a.datum >= pr.von && a.datum <= pr.bis);
  const mAll = S.massn, mOk = mAll.filter(m => m.owner && m.due).length;
  const mDone = mAll.filter(m => ['erledigt', 'wirksam'].includes(m.status)), mWirk = mDone.filter(m => m.status === 'wirksam').length;
  const lvl = (v, ok, warn) => v >= ok ? 'ok' : v >= warn ? 'warn' : 'bad';
  return [
    { k: lvl(st.quote, 95, 85), t: 'Alle Beschäftigten unterwiesen', d: `${st.quote}% der erforderlichen Unterweisungen gültig, ${st.over + st.nie} Lücken` },
    { k: lvl(pct(erstOk, neu.length), 100, 70), t: 'Erstunterweisung vor Arbeitsbeginn', d: `${erstOk} von ${neu.length} neuen Beschäftigten der letzten 12 Monate am ersten Tag unterwiesen` },
    { k: lvl(pct(tSig, tIn.length), 100, 90), t: 'Teilnehmerlisten mit Unterschrift', d: `${tSig} von ${tIn.length} Präsenz-Terminen vollständig unterschrieben` },
    { k: S.themen.every(t => t.cards.length) ? 'ok' : 'warn', t: 'Inhalte der Unterweisungen dokumentiert', d: `${S.themen.length} Themen mit Inhalt und Turnus` },
    { k: aIn.length >= 2 ? 'ok' : aIn.length ? 'warn' : 'bad', t: 'Begehungen und Audits durchgeführt', d: `${aIn.length} abgeschlossen im Zeitraum` },
    { k: lvl(pct(mOk, mAll.length), 100, 90), t: 'Mängel mit Maßnahme, Verantwortlichem und Termin', d: `${mOk} von ${mAll.length} Maßnahmen vollständig` },
    { k: overM().length ? (overM().some(m => m.risiko === 'hoch') ? 'bad' : 'warn') : 'ok', t: 'Maßnahmen fristgerecht umgesetzt', d: overM().length ? `${overM().length} überfällig, davon ${overM().filter(m => m.risiko === 'hoch').length} mit hohem Risiko` : 'Keine überfälligen Maßnahmen' },
    { k: lvl(pct(mWirk, mDone.length), 60, 30), t: 'Wirksamkeit geprüft', d: `${mWirk} von ${mDone.length} erledigten Maßnahmen auf Wirksamkeit geprüft` }
  ];
}

        <li>Deckblatt und Kennzahlen</li><li>Prüfliste wie links</li><li>Unterweisungsmatrix</li><li>Nachweise im Zeitraum</li><li>Teilnehmerlisten mit Unterschrift</li><li>Audit- und Begehungsberichte mit Fotos</li><li>Maßnahmenliste</li></ol></div></section>

        <p class="hint">Excel für eigene Auswertungen. Für Behörden besser das PDF, es enthält die Unterschriften.</p></div></section>

/* ---------- Dialoge ---------- */
let LASTF = null, SDIRTY = false;
const finePointer = () => { try { return matchMedia('(pointer: fine)').matches; } catch (e) { return false; } };
function openSheet(html, wide) {
  if ($('overlay').hidden) LASTF = document.activeElement;
  SDIRTY = false;
  $('sheet').className = 'sheet' + (wide ? ' wide' : ''); $('sheet').innerHTML = html; $('overlay').hidden = false;
  decorateFields($('sheet'));
  const f = finePointer() ? $('sheet').querySelector('input:not([type=checkbox]):not([type=file]):not([type=radio]):not([disabled]), textarea:not([disabled]), select:not([disabled])') : null;
  setTimeout(() => { try { (f || $('sheet')).focus(); } catch (e) {} }, 30);
}
function closeSheet() {

}

  }
  else if (id === 'thForm') {
    const t = f.dataset.id ? thema(f.dataset.id) : { id: 'th' + uid(''), color: 't' + (1 + S.themen.length % 5) };
    const cards = v('th-c').split(/\n\s*\n/).map(b => b.trim().split('\n')).filter(l => l[0]).map(l => ({ t: l[0].trim(), x: l.slice(1).join(' ').trim() }));
    const quiz = v('th-q').split(/\n\s*\n/).map(b => b.trim().split('\n').map(s => s.trim()).filter(Boolean)).filter(l => l.length >= 3).map(l => { const ans = l.slice(1); return { q: l[0], a: ans.map(a => a.replace(/^[*-]\s*/, '')), r: Math.max(0, ans.findIndex(a => a.startsWith('*'))) }; });

    const sameC = f.dataset.id && v('th-c') === cardsText(t).trim(), sameQ = f.dataset.id && v('th-q') === quizText(t).trim();

  else if (id === 'impForm') { if (IMP && IMP.some(r => !r.err)) impApply(); }
  else if (id === 'pForm') {
    const name = v('pf-n');
    if (!name) { fieldErr('pf-n', 'Bitte Vor- und Nachnamen eingeben.'); return; }
    let p = f.dataset.id ? person(f.dataset.id) : null;
    if (!p && byName(name)) { fieldErr('pf-n', 'Diesen Namen gibt es schon. Bitte zur Unterscheidung z. B. einen zweiten Vornamen ergänzen.'); return; }
