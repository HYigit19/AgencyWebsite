<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Makler-Suite Demo von devunoxAI: KI-Posteingang, Leads & CRM, Objekte, Workflow Management und Dokumentenmanagement in einer Software.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5FA">
<title>Makler-Suite – Muster Immobilien</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23D6336C'/%3E%3Cpath d='M9 16l7-6 7 6v7H9z' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared-files/demo-kit.css">
<script src="shared-files/demo-kit.js"></script>
<style>
@font-face { font-family: 'JetBrains Mono'; src: url('shared-files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 800; font-style: normal; font-display: swap; }
/* Gestaltung wie die übrigen devunoxAI-Demos: helles SaaS-Dashboard, Verlaufs-Sidebar (hier Rosé),
   weiße Karten mit weichem Schatten, Pastell-Kacheln mit Sparklines, Plus Jakarta Sans aus dem Demo-Kit. */
:root{
  color-scheme:light;
  --bg:#F6F5FA;--surface:#fff;--surface-2:#F6F5FA;--line:#ECEAF2;--line-2:#DEDAE8;--ink:#17151F;--ink-2:#5E5B70;--ink-3:#8E8BA0;
  --accent:#D6336C;--accent-2:#F06595;--accent-soft:#FDECF3;--accent-line:#F8C6D8;--accent-ink:#fff;
  --c-home:#D6336C;--c-inbox:#0E9F88;--c-leads:#2563EB;--c-obj:#EA580C;--c-wf:#7C3AED;--c-dms:#DB2777;--c-auto:#5D6470;
  --good:#16A34A;--good-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--crit:#E11D48;--crit-soft:#FFE4E6;--info:#2563EB;--info-soft:#E0EBFF;
  --teal-soft:#DDF5F0;--orange-soft:#FFEDD5;--pink-soft:#FCE7F3;--violet-soft:#EDE9FE;--blue-soft:#E0EBFF;--gray-soft:#F1F0F5;
  --col-over:#E11D48;--col-today:#F59E0B;--col-week:#2563EB;
  --shadow-card:0 1px 2px rgba(16,24,40,.05),0 10px 30px -12px rgba(16,24,40,.14);
  --shadow-lift:0 2px 4px rgba(16,24,40,.06),0 20px 40px -14px rgba(16,24,40,.22);
  --shadow:0 30px 80px -20px rgba(10,14,30,.42),0 0 0 1px rgba(21,26,45,.05);
  --radius:22px;
  --font:var(--dvx-font,'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:-.2px}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Layout & Sidebar ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.col{min-width:0}
.nav{position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);display:flex;flex-direction:column;padding:18px 12px 14px;gap:2px;overflow-y:auto;border-radius:26px;color:#fff;
  background:radial-gradient(120% 60% at 0% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(165deg,#C2255C 0%,#D6336C 45%,#F06595 100%);box-shadow:0 20px 40px -18px rgba(194,37,92,.55);scrollbar-width:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:13px;background:#fff;color:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.brand .logo svg{width:21px;height:21px}
.brand b{display:block;font-size:16.5px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.brand span{font-size:12px;color:rgba(255,255,255,.78)}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.66);padding:14px 12px 6px;font-weight:800}
.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:0;background:none;text-align:left;width:100%;font-weight:700;font-size:14px;color:rgba(255,255,255,.92);transition:background .15s,color .15s}
.ni:hover{background:rgba(255,255,255,.14);color:#fff}
.ni.on{background:#fff;color:var(--accent);box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.ni .tile{width:20px;height:20px;display:grid;place-items:center;flex:none;background:none!important;color:inherit}
.ni .tile svg{width:19px;height:19px}
.ni .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .cnt{font-size:11.5px;font-weight:800;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;display:inline-grid;place-items:center}
.ni.on .cnt{background:var(--accent);color:#fff}
.ni .cnt.hot{background:#fff;color:var(--accent)}
.ni.on .cnt.hot{background:var(--accent);color:#fff}
.nav-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.viewas{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:0;width:100%;text-align:left;color:#fff;transition:background .15s}
.viewas:hover{background:rgba(255,255,255,.24)}
.viewas small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:800}
.viewas b{display:block;font-size:13.5px}
.viewas span{font-size:11.5px;color:rgba(255,255,255,.8)}
.navnote{font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.78);padding:2px 8px}
.navlink{font-size:12px;color:rgba(255,255,255,.9);background:none;border:0;padding:0;text-align:left;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.powered{font-size:11px;color:rgba(255,255,255,.7);padding:0 8px}
.powered a{color:#fff;font-weight:800;text-decoration:none}

.main{padding:18px 30px 60px;min-width:0;max-width:1520px;width:100%}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.topbar .grow{flex:1}
.tsearch{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);border:0;color:var(--ink-3);min-width:300px;font-weight:600;font-size:13.5px}
.tsearch:hover{color:var(--ink-2)}
.tsearch kbd{margin-left:auto;font:700 11px var(--mono);background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--ink-3)}
#topTools{display:flex;align-items:center;gap:8px}
#topTools .dvx-lang{background:var(--surface);box-shadow:var(--shadow-card);padding:4px}
#topTools .dvx-lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.mtop{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head .date{font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin:0 0 4px}
.head h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.12}
.head p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
.head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--c,var(--accent));color:#fff;font-weight:700;white-space:nowrap;transition:transform .15s,filter .15s,box-shadow .15s;box-shadow:0 10px 20px -12px var(--c,var(--accent))}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 12px 24px -12px var(--accent)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px;gap:6px}
.btn.xs{min-height:28px;padding:0 11px;font-size:12px;gap:5px;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--c,var(--accent));box-shadow:inset 0 0 0 1.5px var(--c,var(--accent))}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.plain{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}
.btn.danger{--c:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--gray-soft);color:var(--ink-2)}
.chip.solid{color:#fff}
.chip svg{width:13px;height:13px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-over{background:var(--crit-soft);color:var(--crit)}
.p-today{background:var(--warn-soft);color:var(--warn)}
.p-week{background:var(--info-soft);color:var(--info)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-gray{background:var(--gray-soft);color:var(--ink-2)}
.p-violet{background:var(--accent-soft);color:var(--accent)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff!important;font-weight:800;font-size:11px!important;flex:none;box-shadow:0 0 0 2px var(--surface)}
.av.lg{width:54px;height:54px;font-size:17px!important}
.av.sm{width:24px;height:24px;font-size:9.5px!important}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;color:#fff;background:linear-gradient(120deg,var(--accent),#7C3AED)}
.ai-badge svg{width:12px;height:12px}
.tabs{display:flex;gap:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1.5px solid transparent;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:not(.on):hover{background:var(--surface)}
.tabs button.on{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.tabs button .n{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--surface);display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink-2);box-shadow:0 0 0 1px var(--line)}
.tabs button.on .n{background:var(--accent);color:#fff;box-shadow:none}
.tabs button svg{width:15px;height:15px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:0 14px;height:42px;box-shadow:var(--shadow-card);min-width:220px}
.search:focus-within{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-card)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search svg{color:var(--ink-3)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .grow{flex:1}

/* ---------- Cards ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:20px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.card .sub{color:var(--ink-2);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-title h2{margin:0;font-size:18px;font-weight:800}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}

/* demo banner */
.demo{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo p{margin:2px 0 6px;color:var(--ink-2);max-width:520px}
.uchips{display:flex;gap:8px;flex-wrap:wrap}
.uchip{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 12px 6px 6px;text-align:left;transition:border-color .15s}
.uchip:hover{border-color:var(--accent-line)}
.uchip b{display:block;font-size:13px;line-height:1.2}
.uchip span{font-size:11.5px;color:var(--ink-2)}
.uchip.on{border-color:var(--accent);background:var(--accent-soft)}

/* hero */
.hero{color:#fff;border-radius:26px;padding:22px;margin-top:16px;background:radial-gradient(90% 120% at 100% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(135deg,#C2255C,#E64980 55%,#F783AC);box-shadow:0 24px 44px -24px rgba(194,37,92,.7)}
.hero-top{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.hero .num{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-size:27px;font-weight:800;flex:none}
.hero .num svg{width:26px;height:26px}
.hero h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:2px 0 0;opacity:.88;font-weight:600}
.hero .start{margin-left:auto;background:#fff;color:var(--accent);border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:14.5px}
.hrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border:0;color:#fff;width:100%;text-align:left;border-radius:14px;padding:10px 12px;margin-top:6px;font-weight:700;transition:background .15s}
.hrow:hover{background:rgba(255,255,255,.24)}
.hrow .mono{opacity:.8}
.hrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .due{background:#fff;color:var(--accent);border-radius:999px;padding:1px 10px;font-size:12px}
.hero-empty{display:flex;align-items:center;gap:14px}

/* KPI tiles */
.kt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.kt{background:var(--surface);border:0;border-radius:var(--radius);box-shadow:var(--shadow-card);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;color:var(--ink);transition:transform .2s,box-shadow .2s}
button.kt:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.kt-top{display:flex;align-items:center;gap:10px;min-width:0}
.kt-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.kt-ic svg{width:19px;height:19px}
.kt-l{font-size:13px;font-weight:700;color:var(--ink-2);line-height:1.25;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.kt-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:0}
.kt-v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kt-v small{font-size:16px;font-weight:800;color:var(--ink-2);margin-left:2px}
.kt-mid .dvx-spark{flex:none}
.kt-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.kt-f small{font-size:12px;color:var(--ink-2);font-weight:600}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.trend.good{background:#DCFCE7;color:#15803D}.trend.bad{background:#FFE4E6;color:#E11D48}.trend.flat{background:var(--surface-2);color:var(--ink-2)}
.charts{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:4px;display:inline-block}
.gauge-w{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-w .dvx-gauge{max-width:100%;height:auto}
.g-val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:-6px}
.g-val small{font-size:15px;color:var(--ink-2)}
.gstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;margin-top:6px}
.gstats div{background:var(--surface-2);border-radius:14px;padding:8px 6px;text-align:center;min-width:0}
.gstats b{display:block;font-size:16px;font-weight:800}
.gstats span{display:block;font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-w{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.dl{display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px}
.dl div{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.dl i{width:10px;height:10px;border-radius:4px;flex:none}
.dl b{margin-left:auto}

/* task columns */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.colhead{display:flex;justify-content:space-between;align-items:center;border-radius:16px;padding:11px 14px;color:#fff;font-weight:800;font-size:14.5px;margin-bottom:10px}
.colhead span{background:rgba(255,255,255,.22);border-radius:999px;min-width:26px;text-align:center;padding:0 8px}
.tcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-card);padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.tcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tcard b{display:block;font-size:14.5px;line-height:1.3}
.tcard .sub{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.tcard .bot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.empty{border:1.5px dashed var(--line-2);border-radius:18px;padding:18px;text-align:center;color:var(--ink-2);font-weight:600}

/* insights */
.ins{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.ins .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.ins b{display:block;font-size:13.5px}
.ins span{font-size:12.5px;color:var(--ink-2)}
.appt{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.appt:last-child{border-bottom:0}
.appt .when{width:58px;text-align:center;border-radius:14px;background:var(--accent-soft);color:var(--accent);padding:6px 0;font-weight:800;font-size:13px;line-height:1.15;flex:none}
.appt .when small{display:block;font-size:10.5px;font-weight:700;opacity:.85}

.dash-row{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:stretch}
.dash-row .hero{margin-top:0}
.uchips.col{flex-direction:column;flex-wrap:nowrap}
.uchips.col .uchip{width:100%}
.docname span{overflow-wrap:anywhere}
.tbl td{padding:11px 12px}.tbl th{padding:11px 12px}
@media (max-width:1180px){.dash-row{grid-template-columns:minmax(0,1fr)}}
/* ---------- Inbox ---------- */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-card);padding:9px 14px;display:flex;gap:9px;align-items:center;font-weight:700;font-size:13px}
.stat b{font-size:17px}
.stat .dot{width:9px;height:9px;border-radius:50%}
.inbox{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
.mlist{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden;max-height:calc(100vh - 250px);overflow-y:auto;position:sticky;top:16px}
.mi{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--accent-soft)}
.mi.unread::before{content:"";position:absolute;left:5px;top:22px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mi .body{flex:1;min-width:0}
.mi .r1{display:flex;justify-content:space-between;gap:8px}
.mi .r1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .time{font-size:12px;color:var(--ink-3);white-space:nowrap}
.mi .subj{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mi .snip{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mdetail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.mail-h h2{margin:0 0 8px;font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.mail-from{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mail-from .dvx-lang,.mail-from .seg{margin-left:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.mail-body{white-space:pre-wrap;font-size:14.5px;line-height:1.7;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.mail-body mark{border-radius:5px;padding:0 3px;color:inherit}
mark.h-name{background:#EDE4FF}mark.h-contact{background:#DCE8FF}mark.h-obj{background:#FFE3CC}mark.h-money{background:#D3F3DF}mark.h-fin{background:#CFF2EC}mark.h-date{background:#FFF0B8}
.attach{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:12px;padding:7px 11px;font-size:12.5px;font-weight:700;margin:10px 8px 0 0}
.ai-panel{border-radius:var(--radius);padding:2px;background:linear-gradient(140deg,var(--accent-2),#A78BFA 55%,#5EEAD4);position:sticky;top:16px;box-shadow:0 20px 40px -24px rgba(214,51,108,.55)}
.ai-panel .in{background:var(--surface);border-radius:20px;padding:18px}
.ai-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13px}
.facts dt{color:var(--ink-2);font-weight:600}
.facts dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.conf{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:12.5px;font-weight:700}
.conf .track{flex:1;height:7px;border-radius:999px;background:var(--gray-soft);overflow:hidden}
.conf .fill{height:100%;background:linear-gradient(90deg,var(--accent),#7C3AED)}
.result{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:13px}
.result b{display:block;font-size:14px;margin-bottom:2px}
.r-good{background:var(--good-soft);color:#14532D}
.r-warn{background:var(--warn-soft);color:#713F12}
.r-gray{background:var(--gray-soft);color:var(--ink-2)}
.r-info{background:var(--accent-soft);color:#8C1D46}
.steps-ai{list-style:none;margin:6px 0 0;padding:0}
.steps-ai li{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.steps-ai li.done{color:var(--ink)}
.steps-ai li .b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gray-soft);flex:none}
.steps-ai li.done .b{background:var(--good);color:#fff}
.steps-ai li.run .b{background:var(--accent-soft)}
.steps-ai li.run .b::after{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.steps-ai li .b svg{width:12px;height:12px;stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}
textarea.draft{width:100%;min-height:190px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;resize:vertical;font-size:13.5px;line-height:1.6;background:var(--surface-2);outline:0}
textarea.draft:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.backbtn{display:none}

/* ---------- Leads board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.lane{flex:0 0 240px;background:rgba(255,255,255,.6);border-radius:22px;padding:8px;min-height:240px;scroll-snap-align:start;transition:background .15s}
.lane.over{background:var(--accent-soft);outline:2px dashed var(--accent)}
.lane-h{border-radius:16px;padding:10px 12px;color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lane-h small{display:block;font-weight:600;font-size:11.5px;opacity:.88}
.lane-h>span{background:rgba(255,255,255,.22);border-radius:999px;min-width:26px;text-align:center;padding:0 8px}
.lcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-card);padding:12px;margin-bottom:8px;cursor:grab;user-select:none;transition:transform .12s,box-shadow .12s}
.lcard:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.lcard.drag{opacity:.4}
.lcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lcard b{font-size:14px;line-height:1.25}
.lcard .obj{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.lcard .r3{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px}
.lcard .next{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:8px;display:flex;gap:5px;align-items:center}
.lcard .next svg{width:13px;height:13px}
.ring{position:relative;width:38px;height:38px;flex:none}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:800}
.ring.lg,.ring.lg svg{width:58px;height:58px}
.ring.lg span{font-size:16px}
table.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card)}
.tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:12px 14px;background:var(--surface)}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FDF7FA}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow-card)}
.tbl-wrap .tbl{box-shadow:none}

/* ---------- Properties ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:var(--surface);border-radius:24px;box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.pimg{height:164px;position:relative}
.pimg svg{width:100%;height:100%;display:block}
.pimg .st{position:absolute;left:12px;top:12px}
.pimg .ref{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 7px}
.pbody{padding:14px 16px 16px}
.pbody .price{font-size:21px;font-weight:800;letter-spacing:-.02em}
.pbody .title{font-weight:700;margin-top:2px}
.pbody .addr{color:var(--ink-2);font-size:13px}
.facts-row{display:flex;gap:14px;margin-top:10px;font-size:13px;font-weight:600;color:var(--ink-2);flex-wrap:wrap}
.facts-row span{display:flex;gap:5px;align-items:center}
.facts-row svg{width:14px;height:14px}
.pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.meter{height:7px;border-radius:999px;background:var(--gray-soft);overflow:hidden;width:90px}
.meter i{display:block;height:100%;border-radius:999px}

/* ---------- Workflows ---------- */
.wfcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:18px;align-items:center;transition:box-shadow .15s,transform .15s}
.wfcard:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.wfcard b{font-size:15px}
.dots{display:flex;align-items:center}
.dots i{height:4px;flex:1;background:var(--line)}
.dots i.d{background:var(--accent)}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none;box-shadow:0 0 0 3px var(--surface)}
.dots span.d{background:var(--accent)}
.dots span.c{background:#fff;box-shadow:0 0 0 3px var(--accent)}
.wf-cur{font-size:12.5px;color:var(--ink-2);margin-top:6px;font-weight:600}
.chain{list-style:none;margin:0;padding:0;position:relative}
.chain li{display:flex;gap:14px;padding:0 0 18px;position:relative}
.chain li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.chain li:last-child::before{display:none}
.chain li.done::before{background:var(--accent)}
.chain .nd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gray-soft);color:var(--ink-3);font-weight:800;font-size:13px;flex:none;z-index:1}
.chain li.done .nd{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.chain li.cur .nd{background:#fff;color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.chain .tx{flex:1;min-width:0;padding-top:5px}
.chain .tx b{font-size:14.5px}
.chain .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.chain .act{background:var(--accent-soft);border-radius:16px;padding:12px;margin-top:10px}
.rule{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-card);padding:14px 16px;margin-bottom:10px}
.rule .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.rule .tx{flex:1;min-width:0}
.rule .tx b{display:block}
.rule .tx span{font-size:12.5px;color:var(--ink-2)}
.when-then{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line-2);border:0;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--good)}
.sw.on::after{left:21px}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.tplchain{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tplchain span{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:600}
.tplchain span em{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;border-radius:6px;padding:0 5px}

/* ---------- DMS ---------- */
.dms{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.tree{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:10px;position:sticky;top:16px}
.tree button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px 10px;border-radius:12px;text-align:left;font-weight:600;font-size:13.5px}
.tree button:hover{background:var(--surface-2)}
.tree button.on{background:var(--accent-soft);color:var(--accent)}
.tree button .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:800}
.tree .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:12px 10px 4px}
.tree button span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{border:2px dashed var(--accent-line);background:linear-gradient(135deg,#FFF5F9,#FDECF3);border-radius:var(--radius);padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:14px;transition:all .15s}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop .ic{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;flex:none}
.drop b{display:block;font-size:15px}
.drop span{font-size:13px;color:var(--ink-2)}
.ask{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:999px;padding:5px 5px 5px 10px;box-shadow:var(--shadow-card);margin-bottom:10px}
.ask:focus-within{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-card)}
.ask input{flex:1;border:0;outline:0;background:none;min-width:0;height:36px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sugg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.answer{border-radius:var(--radius);padding:2px;background:linear-gradient(140deg,var(--accent-2),#A78BFA);margin-bottom:14px}
.answer .in{background:var(--surface);border-radius:20px;padding:14px 16px}
.dicon{width:34px;height:40px;border-radius:9px;display:grid;place-items:center;color:#fff!important;font-size:9.5px!important;font-weight:800;flex:none;letter-spacing:.3px}
.docname{display:flex;align-items:center;gap:11px}
.docname b{display:block;font-size:13.5px}
.docname span{font-size:12px;color:var(--ink-2)}
.paper{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08),0 0 0 1px var(--line);padding:24px 26px;font-size:12.5px;min-height:300px}
.paper h4{margin:0 0 4px;font-size:16px}
.paper .line{height:7px;border-radius:4px;background:#EFEDF4;margin:8px 0}
.paper table{width:100%;border-collapse:collapse;margin:12px 0}
.paper td{border:1px solid var(--line);padding:6px 8px}
.ebar{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:10px 0 4px}
.ebar i{flex:1}

/* ---------- Drawer / modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(17,20,45,.42);z-index:40;animation:fade .15s;backdrop-filter:blur(2px)}
.drawer{position:fixed;right:10px;top:10px;bottom:10px;width:min(620px,calc(100vw - 20px));background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .25s var(--ease);border-radius:26px;overflow:hidden}
.dr-head{background:var(--surface);padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dr-top{display:flex;gap:14px;align-items:flex-start}
.dr-top h2{margin:0;font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.dr-top .x{margin-left:auto}
.dr-body{padding:16px 20px 40px;overflow-y:auto;flex:1}
.stepper{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.stepper button{flex:1;min-width:76px;border:0;border-radius:10px;padding:7px 4px;font-size:11.5px;font-weight:800;background:var(--gray-soft);color:var(--ink-2);white-space:nowrap}
.stepper button.d{background:var(--accent-soft);color:var(--accent)}
.stepper button.c{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink-2);font-weight:600}
.kv dd{margin:0;font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.tl .ic svg{width:15px;height:15px}
.tl b{font-size:13.5px;display:block}
.tl span{font-size:12.5px;color:var(--ink-2)}
.tl p{margin:6px 0 0;font-size:13px;background:var(--surface);border-radius:14px;padding:9px 11px;box-shadow:var(--shadow-card);white-space:pre-wrap}
.match{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-card);padding:10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
.match:hover{box-shadow:var(--shadow-lift)}
.match .thumb{width:84px;height:58px;border-radius:12px;overflow:hidden;flex:none}
.match .thumb svg{width:100%;height:100%}
.match .tx{flex:1;min-width:0}
.match .tx b{display:block;font-size:13.5px}
.match .tx span{font-size:12.5px;color:var(--ink-2)}
.mpct{font-weight:800;font-size:15px}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(17,20,45,.46);animation:fade .15s;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;animation:pop .2s var(--ease)}
.modal.wide{width:min(760px,100%)}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.modal .sub{color:var(--ink-2);margin:0 0 16px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);outline:0}
.field textarea{height:auto;min-height:150px;padding:10px 12px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px}
.slots button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#1B1726;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px -14px rgba(0,0,0,.45);max-width:420px;animation:up .2s ease-out;font-weight:600}
.toast .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.toast button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;white-space:nowrap}
.palette{width:min(620px,100%);padding:0;overflow:hidden}
.palette .search{box-shadow:none;border-bottom:1px solid var(--line);border-radius:0;height:58px;padding:0 18px}
.palette .res{max-height:420px;overflow-y:auto;padding:8px}
.palette .it{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}
.palette .it:hover,.palette .it.on{background:var(--accent-soft)}
.palette .it b{display:block;font-size:13.5px}
.palette .it span{font-size:12px;color:var(--ink-2)}
.popover{position:fixed;z-index:55;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:8px;width:270px;animation:pop .14s;color:var(--ink)}
.popover button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px;border-radius:12px;text-align:left}
.popover button:hover,.popover button.on{background:var(--accent-soft)}
.popover b{display:block;font-size:13.5px}
.popover span{font-size:12px;color:var(--ink-2)}
.popover .navlink{color:var(--accent)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@keyframes up{from{transform:translateY(10px);opacity:0}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.flash{animation:flash 2.2s ease-out}
.lcard.flash{animation:none;box-shadow:0 0 0 2px var(--accent),var(--shadow-card)}
.tabbar{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1600px){
  .mdetail{grid-template-columns:minmax(0,1fr)}
  .ai-panel{position:static;order:-1}
}

function score(l){
  if(l.type==='owner') return l.stage==='new'?78:86;
  let s=22; if(l.phone) s+=10; if(l.email) s+=4;
  const p=prop(l.prop);
  if(l.type==='buy'){ if(l.fin) s+=25; else if(l.fin===false) s+=6; if(p&&l.budget&&p.price){ const r=l.budget/p.price; s+= r>=0.97?22: r>=0.9?14: r>=0.8?6:0; } }
  if(l.type==='rent'){ if(p&&l.income){ const r=l.income/p.price; s+= r>=3?28: r>=2.5?18: r>=2?8:0; } else s+=10; if(p&&l.budget>=p.price) s+=10; }
  if(p) s+=8;
  s+= {new:0,qual:4,view:8,offer:12,res:16,won:18}[l.stage]||0;
  return Math.min(99, s);
}
function scoreCol(s){ return s>=80?'#1F8A55':s>=60?'#2F6FD6':s>=40?'#F4B23F':'#D93644'; }
function ring(s, lg){ const r=lg?24:15, c=2*Math.PI*r, sz=lg?58:38, w=lg?5:4; return `<div class="ring ${lg?'lg':''}"><svg viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="#EEF0F7" stroke-width="${w}" fill="none"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="${scoreCol(s)}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-dasharray="${c*s/100} ${c}"/></svg><span>${s}</span></div>`; }
function matchPct(l, p){
  if(!p || l.type==='owner') return 0;
  if(l.stage==='won' && l.prop!==p.id) return 0;
  if((l.type==='buy')!==(p.deal==='sale')) return 0;
  let m=40; if(l.prop===p.id) m+=35;
  if(l.budget&&p.price){ const r=l.budget/p.price; m+= r>=1?20: r>=0.9?14: r>=0.8?6:-10; }
  const pr=L(l.profile)||''; if(pr.toLowerCase().includes(p.city.split(' ').slice(1).join(' ').split('-')[0].toLowerCase())) m+=8;
  if(['sold','rented'].includes(p.status)) m-=40; if(p.status==='res'&&l.prop!==p.id) m-=25;
  return Math.max(5, Math.min(99, m));
}
function streetKey(p){ return p.street.replace(/\s*\d+\w?$/,'').toLowerCase(); }
function docsFor(p){ return S.docs.filter(d=>d.prop===p.id && !d.tpl); }
function reqFor(p){ return p.deal==='rent'?REQ.rentflat:REQ[p.kind]; }
function completeness(p){ const req=reqFor(p); const have=req.filter(r=>docsFor(p).some(d=>d.type===r)); return {req, have, pct:Math.round(have.length/req.length*100)}; }
function wfStep(w){ return WFT[w.tpl].steps[w.step]; }

function simulate(){
  if(!S.queue.length){ toast(t('queueEmpty'),'spark','var(--accent)'); openModal({type:'testMail'}); return; }
  const q=S.queue.shift(); arrive(q);
}
function arrive(q){
  const id='M'+(++S.seq.mail);
  const m=Object.assign({}, q, {id, at:new Date().toISOString(), read:true, status:'proc', lead:null});
  S.mails.unshift(m);
  const f=m.f, p=prop(f.prop);
  const steps=[t('procRead'), t('procIntent',{x:t(INTENT[f.intent])+' ('+f.conf+' %)'}), t('procContact')];
  const rules=Object.fromEntries(S.rules.map(r=>[r.id,r.on]));
  let plan='lead';
  if(f.intent==='spam' && rules.R8) plan='ign';
  else if(f.intent==='update') plan='upd';
  else if(f.intent==='unclear' || !rules.R1) plan='review';
  if(plan==='lead'||plan==='review'){ steps.push(p?t('procObj',{x:p.ref+' '+p.street}):t('procNoObj')); }
  const newId = plan==='lead' ? 'L-'+(S.seq.lead+1) : null;
  const ownerId = p?.agent || (f.intent==='rent'?'ak':'ts');
  if(plan==='lead'){ steps.push(t('procLead',{x:newId}), t('procAssign',{x:user(ownerId).name})); if(f.intent==='owner'&&rules.R4) steps.push(t('procWf')); if(rules.R2) steps.push(t('procDraft')); }
  if(plan==='upd'){ steps.push(t('procUpd',{x:f.leadId||''})); if(m.att.length) steps.push(t('procDoc')); }
  if(plan==='ign') steps.push(t('procSpam'));
  UI.proc={id, steps, n:0}; UI.mail=id; UI.mailFilter='all';
  if(UI.view!=='inbox') go('inbox'); else render();
  const tick=()=>{ if(!UI.proc||UI.proc.id!==id) return; UI.proc.n++; if(UI.proc.n>=steps.length){ finish(); return; } render(); setTimeout(tick, 520); };
  setTimeout(tick, 600);
  function finish(){
    UI.proc=null;
    if(plan==='lead'){ const l=createLeadFromMail(m); m.lead=l.id; m.status='lead'; toast(t('leadCreated',{id:l.id,n:l.name}),'users','var(--c-leads)',{label:t('openLead'),act:'open',t:'lead',id:l.id}); flashId=l.id; }
    else if(plan==='upd'){ const l=lead(f.leadId); if(l){ m.lead=l.id; if(f.fin){ l.fin=true; } if(f.budget) l.budget=f.budget; l.acts.push({type:'mail',at:m.at,de:'E-Mail: '+m.subject.de,en:'E-mail: '+m.subject.en,by:'ai'}); m.att.forEach(a=>{ const d={id:'D'+(++S.seq.doc),type:'fin',name:a,prop:f.prop,lead:l.id,ver:1,by:'ai',at:new Date().toISOString(),status:'ok',size:212}; S.docs.push(d); l.acts.push({type:'doc',at:m.at,de:'Finanzierungsbestätigung automatisch im DMS abgelegt',en:'Financing confirmation filed in DMS automatically',by:'ai'}); }); m.status='upd'; m.f.extra={de:'Finanzierung jetzt bestätigt (520.000 €) – Score steigt. Anhang im DMS abgelegt und mit Lead & Objekt verknüpft.',en:'Financing now confirmed (€520,000) – score rises. Attachment filed in DMS and linked to lead & property.'}; toast(t('leadUpdated',{id:l.id}),'refresh','var(--info)',{label:t('openLead'),act:'open',t:'lead',id:l.id}); } }
    else if(plan==='ign'){ m.status='ign'; }
    else { m.status='review'; }
    save(); render();
  }
}

function createLeadFromMail(m){
  const f=m.f, p=prop(f.prop);

// heuristic parser for user-provided e-mails
function parseMail(text){
  const low=text.toLowerCase(); const hl=[];
  const email=(text.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/)||[])[0]||''; if(email) hl.push([email,'contact']);
  const phone=((text.match(/(\+\d{1,3}[\s\d\/-]{7,}\d|0\d{2,5}[\s\/-]?\d[\d\s\/-]{4,}\d)/)||[])[0]||'').trim(); if(phone) hl.push([phone,'contact']);
  let p=null; const ref=text.match(/OB-\d{4}/i); if(ref){ p=S.props.find(x=>x.ref.toLowerCase()===ref[0].toLowerCase()); if(p) hl.push([ref[0],'obj']); }
  if(!p){ for(const x of S.props){ const k=streetKey(x); const k2=k.replace('straße','strasse'); const i=low.indexOf(k)>=0?low.indexOf(k):low.indexOf(k2); if(i>=0){ p=x; hl.push([text.substr(i,k.length),'obj']); break; } } }
  let budget=null; const re=/(\d{1,3}(?:[.,\s]\d{3})+|\d{3,7})\s*(?:€|eur\b|euro)|(?:€|eur)\s?(\d{1,3}(?:[.,]\d{3})+|\d{3,7})/gi; let mm; const nums=[];
  while((mm=re.exec(text))){ const raw=(mm[1]||mm[2]).replace(/[.,\s]/g,''); const n=parseInt(raw,10); if(n>=300) { nums.push(n); hl.push([mm[0],'money']); } }
  if(nums.length) budget=Math.max(...nums);
  let intent='unclear';
  if(/verkaufen|bewertung|marktwert|sell my|selling my|valuation|what is it worth|was ist .* wert/i.test(text)) intent='owner';
  else if(/miet|kaltmiete|warmmiete|\brent\b|rental|lease|tenant/i.test(text)) intent='rent';
  else if(/kauf|erwerb|\bbuy\b|purchase|kaufpreis|finanzierung|mortgage/i.test(text)) intent='buy';
  if(!p && intent==='buy' && budget) { /* remains search profile */ }
  const fin = /finanzierungs(bestätigung|zusage)|finanzierung (ist )?(gesichert|bestätigt|steht)|pre-?approv|mortgage approval|financing (is )?(confirmed|approved|in place)/i.test(text) ? true : (/finanzierung kläre|finanzierung läuft|still sorting.*financ/i.test(text)?false:null);
  const fm=text.match(/finanzierungs(bestätigung|zusage)|pre-?approv\w*|financing (?:is )?(?:confirmed|approved|in place)/i); if(fm) hl.push([fm[0],'fin']);
  const wm=text.match(/(?:am |on |next |nächste[nr]? )?(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|monday|tuesday|wednesday|thursday|friday|saturday|sunday|wochenende|weekend)\w*/i); if(wm) hl.push([wm[0],'date']);
  let name='';
  const nm=text.match(/(?:^|\n)\s*name\s*:\s*(.+)/i);
  if(nm) name=nm[1].trim();
  if(!name){ const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean); const gi=lines.findIndex(x=>/grü(ß|ss)e|gruß|regards|best wishes|cheers|^thanks|^mfg/i.test(x)); if(gi>=0 && lines[gi+1] && lines[gi+1].length<40 && !/@|\d{4}/.test(lines[gi+1])) name=lines[gi+1].replace(/[,.]$/,''); }
  if(!name){ const m2=text.match(/(?:mein name ist|my name is)\s+([A-ZÄÖÜ][\wäöüß-]+(?:\s[A-ZÄÖÜ][\wäöüß-]+)?)/i); if(m2) name=m2[1]; }
  if(!name && email){ name=email.split('@')[0].split(/[._-]/).map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join(' '); }
  if(name) hl.push([name,'name']);
  const en=(low.match(/\b(the|and|we|you|would|looking|please|thanks|our)\b/g)||[]).length, de=(low.match(/\b(der|die|und|wir|sie|ich|bitte|wäre|unser|gerne)\b/g)||[]).length;
  let conf=52; if(email) conf+=10; if(phone) conf+=8; if(p) conf+=14; if(budget) conf+=6; if(intent!=='unclear') conf+=8; if(name) conf+=4;
  return {name:name||'Unbekannt',email,phone,intent,prop:p?.id||null,budget,fin,when:wm?{de:wm[0],en:wm[0]}:null,conf:Math.min(98,conf),hl,lang:en>de?'en':'de'};
}
function arriveCustom(text){
  const r=parseMail(text);
  const pp=prop(r.prop); const ik=INTENT[r.intent]||'iUnclear';
  const q={name:r.name,from:r.email||'unbekannt@example.de',phone:r.phone,ch:'mail',lang:r.lang,att:[],subject:{de:'Test: '+T[ik][0]+(pp?' – '+pp.street:''),en:'Test: '+T[ik][1]+(pp?' – '+pp.street:'')},body:text,trans:null,f:{intent:r.intent,prop:r.prop,budget:r.budget,fin:r.fin,when:r.when,conf:r.conf,hl:r.hl,name:r.name,phone:r.phone}};

}

function paletteResults(q){
  q=(q||'').toLowerCase(); const r=[];
  S.leads.forEach(l=>{ if(!q||(l.name+' '+l.id).toLowerCase().includes(q)) r.push({t:'lead',id:l.id,ic:'users',c:'var(--c-leads)',a:l.name,b:l.id+' · '+(prop(l.prop)?.street||'')}); });
  S.props.forEach(p=>{ if(!q||(p.street+' '+p.ref+' '+p.city).toLowerCase().includes(q)) r.push({t:'prop',id:p.id,ic:'building',c:'var(--c-obj)',a:p.street,b:p.ref+' · '+p.city}); });
  S.docs.forEach(d=>{ if(q&&(d.name+' '+L(DOCT[d.type])).toLowerCase().includes(q)) r.push({t:'doc',id:d.id,ic:'file',c:'var(--c-dms)',a:L(DOCT[d.type]),b:d.name}); });
  S.mails.forEach(m=>{ if(q&&(m.name+' '+L(m.subject)).toLowerCase().includes(q)) r.push({t:'mail',id:m.id,ic:'mail',c:'var(--c-inbox)',a:L(m.subject),b:m.name}); });
  S.wfs.forEach(w=>{ if(q&&(w.id+' '+wfTitle(w)).toLowerCase().includes(q)) r.push({t:'wf',id:w.id,ic:'flow',c:'var(--c-wf)',a:wfTitle(w),b:w.id}); });
  return r.slice(0,12);
}

  renderNav();
  const V={dashboard:viewDashboard,inbox:viewInbox,leads:viewLeads,properties:viewProperties,workflows:viewWorkflows,documents:viewDocuments}[UI.view]||viewDashboard;
  $('#main').innerHTML=V();

  if(UI.drawer){ const d=UI.drawer; const o= d.t==='lead'?lead(d.id): d.t==='prop'?prop(d.id): d.t==='wf'?wf(d.id): d.t==='doc'?doc(d.id):null;

  if(UI.pop){ layer+=UI.pop; }

  if(fid){ const e=document.getElementById(fid); if(e){ e.focus(); try{ e.setSelectionRange(fs,fs); }catch(x){} } }

}

// ---------------- Drag & drop (leads) ----------------
function bindDnD(){
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',el.dataset.drag); e.dataTransfer.effectAllowed='move'; setTimeout(()=>el.classList.add('drag'),0); });

  });

function classifyName(n){
  const s=n.toLowerCase().replace(/ae/g,'ä').replace(/oe/g,'ö').replace(/ue/g,'ü');
  const rules=[['energy',/energie|epc|energy/],['land',/grundbuch|land.?reg/],['plan',/grundriss|floor|plan/],['map',/flurkarte|lageplan|kataster|cadast/],['decl',/teilung|declar/],['expose',/expos/],['fee',/hausgeld|nebenkost|service.?charge/],['fin',/finanzier|bank|darlehen|mortgage|financ/],['self',/selbstauskunft|schufa|gehalt|payslip|self/],['lease',/mietvertrag|lease|tenancy/],['mandate',/makler|mandat|agency/],['reserve',/reserv/],['photos',/foto|photo|bild|\.jpe?g|\.png|\.heic/],['handover',/übergabe|uebergabe|handover/]];
  let type='other', conf=71; for(const [k,re] of rules){ if(re.test(s)){ type=k; conf=93+Math.round(Math.random()*5); break; } }
  let p=null; const flat=s.replace(/[_\-\s.]/g,'').replace(/ss/g,'ß'); for(const x of S.props){ const k=streetKey(x).replace(/\s/g,''); if(flat.includes(k) || flat.includes(k.replace('straße','str'))){ p=x.id; break; } }
  if(!p){ const r=n.match(/OB-\d{4}/i); if(r) p=S.props.find(x=>x.ref.toLowerCase()===r[0].toLowerCase())?.id||null; }
  const exp = type==='energy'? dAt(3650) : null;
  return {type, prop:p, conf, exp};
}
function handleFiles(files){
  if(!files.length) return;
  const items=files.slice(0,6).map(f=>({name:f.name,size:Math.max(1,Math.round(f.size/1024)),done:false}));
  UI.modal={type:'classify',items,done:false}; render();
  items.forEach((it,i)=>setTimeout(()=>{ Object.assign(it, classifyName(it.name), {done:true}); if(items.every(x=>x.done)) UI.modal.done=true; if(UI.modal&&UI.modal.type==='classify') render(); }, 700+i*550));
}
