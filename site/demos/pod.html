/* Farbsystem: heller SaaS-Look, Akzent Orange (Disposition und Fahrer-App), Pastell-Status. */
:root {
  color-scheme: light;
  --acc: #EA580C;
  --acc-2: #FB923C;
  --acc-d: #C2410C;
  --acc-soft: #FFEDD5;
  --acc-ink: #9A3412;
  --grad: linear-gradient(135deg, #EA580C 0%, #FB923C 100%);
  --bg: #F4F6FB;
  --bg-2: #EEF1F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FC;
  --surface-3: #EEF0F6;
  --line: rgba(21, 26, 45, .10);
  --line-2: rgba(21, 26, 45, .06);
  --ink: #151A2D;
  --ink-2: #4B5268;
  --ink-3: #6B7287;
  /* Pastell-Paletten */
  --violet: #7C3AED; --violet-soft: #EDE9FE;
  --green: #16A34A; --green-soft: #DCFCE7;
  --sky: #0284C7; --sky-soft: #E0F2FE;
  --red: #E11D48; --red-soft: #FFE4E6;
  --check: #B45309; --check-soft: #FEF3C7;
  --amber: #F59E0B; --amber-soft: #FEF3C7; --amber-ink: #3B2300;
  /* Alt-Namen, die im App-Code noch vorkommen */
  --blue: var(--acc); --blue-2: var(--acc-d); --blue-soft: var(--acc-soft);
  --app-bg: #F4F6FB;
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 18px -8px rgba(16, 24, 40, .14);
  --shadow-2: 0 30px 70px -24px rgba(16, 24, 40, .38), 0 4px 14px rgba(16, 24, 40, .08);
  --shadow: var(--dvx-shadow, 0 1px 2px rgba(16, 24, 40, .05), 0 12px 32px -8px rgba(16, 24, 40, .12));
  --r: 20px;
  --f-body: var(--dvx-font, "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif);
  --f-cond: var(--f-body);
  --f-mono: "Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ph: min(780px, calc(100vh - 64px));
  --pw: calc(var(--ph) * .4872);
}
@supports (height: 100dvh) { :root { --ph: min(780px, calc(100dvh - 64px)); } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(900px 420px at 0% -10%, rgba(251, 146, 60, .14), transparent 70%), radial-gradient(700px 380px at 100% 110%, rgba(234, 88, 12, .07), transparent 70%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, select, label, input, textarea, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid rgba(234, 88, 12, .55); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-weight: 500; letter-spacing: -.01em; }
.cond { font-family: var(--f-cond); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Bühne ---------- */
.mshell { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; overflow: hidden; overflow: clip; }
.mshell > .stage { flex: 1; min-height: 0; height: auto; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; }
body.ph-on .stage { grid-template-columns: minmax(0, 1fr) auto; }
.phone-col { display: none; }
body.ph-on .phone-col { display: flex; }
.phone-col { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 22px 12px 8px; min-width: 0; }
.pc-cap { display: flex; align-items: center; gap: 8px; width: var(--pw); color: var(--ink-2); font-size: 13px; }
.pc-cap .pcav { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.pc-cap strong { color: var(--ink); font-weight: 700; }
.pc-cap > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-cap .sp { flex: 1; }
.pc-cap .pc-close { display: none; }

/* ---------- Handy-Rahmen ---------- */
.phone { position: relative; width: var(--pw); height: var(--ph); border-radius: calc(var(--pw) * .145); background: #10131C; padding: calc(var(--pw) * .03); box-shadow: var(--shadow-2), inset 0 0 0 2px #2B3040, inset 0 0 0 4px #090B10; flex: none; }
.phone::before, .phone::after { content: ""; position: absolute; width: 4px; border-radius: 2px; background: #262B38; }
.phone::before { left: -4px; top: 18%; height: 9%; box-shadow: 0 calc(var(--ph) * .12) 0 #262B38; }
.phone::after { right: -4px; top: 24%; height: 13%; }
.screen { position: relative; height: 100%; border-radius: calc(var(--pw) * .118); overflow: hidden; background: var(--app-bg); display: flex; flex-direction: column; isolation: isolate; }
.sbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0 30px; background: var(--acc); color: #fff; font-size: 14px; font-weight: 700; position: relative; }
.sbar .isl { position: absolute; left: 50%; top: 9px; width: 96px; height: 28px; transform: translateX(-50%); background: #000; border-radius: 16px; }
.sbar .ic { display: flex; gap: 5px; align-items: center; }
.sbar svg { width: 17px; height: 12px; fill: #fff; }

/* ---------- Mobil-Umschalter ---------- */
.mswitch { display: none; }

/* ---------- Büro ---------- */
.office { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%; min-height: 0; overflow: hidden; overflow: clip; container-type: inline-size; container-name: office; }
.otop { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; flex: none; min-width: 0; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { width: 42px; height: 42px; border-radius: 14px; background: var(--grad); display: grid; place-items: center; color: #fff; flex: none; box-shadow: 0 8px 18px -8px rgba(234, 88, 12, .8); }
.brand-mark svg { width: 22px; height: 22px; }
.brand b { display: block; font-size: 17px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; white-space: nowrap; }
.brand span { display: block; color: var(--ink-3); font-size: 12.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.brand > div:last-child { min-width: 0; }
.otop .sp { flex: 1; min-width: 6px; }
.otools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; flex: 1 1 auto; }
.brand { flex: 0 1 auto; }
.search { position: relative; flex: 1 1 200px; min-width: 150px; max-width: 340px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 16px; height: 16px; }
.search input { width: 100%; height: 40px; border: 0; border-radius: 999px; background: var(--surface); padding: 0 14px 0 38px; box-shadow: var(--shadow-1); transition: box-shadow .18s; }
.search input::placeholder { color: #8A90A3; }
.search input:focus { outline: none; box-shadow: 0 0 0 3px rgba(234, 88, 12, .28), var(--shadow-1); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13.5px; white-space: nowrap; text-decoration: none; box-shadow: var(--shadow-1); transition: transform .15s, box-shadow .15s, background .15s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(16, 24, 40, .06), 0 10px 22px -10px rgba(16, 24, 40, .25); }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--grad); color: #fff; box-shadow: 0 8px 18px -8px rgba(234, 88, 12, .85); }
.btn.pri:hover { box-shadow: 0 12px 24px -10px rgba(234, 88, 12, .9); }
.btn.ghost { box-shadow: none; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: rgba(21, 26, 45, .06); color: var(--ink); transform: none; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: var(--red); }
.btn[aria-pressed="true"].tgl svg { color: var(--acc); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.icon-btn { width: 40px; padding: 0; }
@container office (max-width: 1120px) { .otop .hide-c { display: none; } }
@container office (max-width: 900px) { .otop .dvx-tourbtn .dvx-tourbtn-t, #phoneToggle span { display: none; } .otop .dvx-tourbtn { padding: 9px; } #phoneToggle { width: 40px; padding: 0; } }
@container office (max-width: 700px) { .brand span { display: none; } }

/* Kennzahl-Kacheln */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 4px 18px 12px; flex: none; }
.kpi { position: relative; background: var(--surface); border: 0; border-radius: var(--r); box-shadow: var(--shadow); padding: 13px 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; font: inherit; color: inherit; transition: transform .18s, box-shadow .18s; overflow: hidden; }
button.kpi:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(16, 24, 40, .05), 0 18px 36px -14px rgba(16, 24, 40, .22); }
.kpi .kh { display: flex; align-items: center; gap: 9px; min-width: 0; }
.kpi .ki { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--acc-soft); color: var(--acc); }
.kpi .ki svg { width: 17px; height: 17px; }
.kpi .l { color: var(--ink-2); font-size: 12.5px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.kpi .kb { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-width: 0; min-height: 50px; }
.kpi .kt { min-height: 21px; display: flex; min-width: 0; }
.kpi .kt .trend { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
.kpi .v small { font-size: 14px; color: var(--ink-3); font-weight: 700; letter-spacing: 0; }
.kpi .kc { flex: none; display: flex; align-items: flex-end; }
.kpi .kc svg { display: block; }
.kpi .s { color: var(--ink-3); font-size: 12px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.trend { display: inline-flex; align-items: center; gap: 3px; height: 21px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; align-self: flex-start; }
.trend.up { background: var(--green-soft); color: var(--green); }
.trend.down { background: var(--red-soft); color: var(--red); }
.trend.flat { background: var(--surface-3); color: var(--ink-2); }
.kpi.t-violet .ki { background: var(--violet-soft); color: var(--violet); }
.kpi.t-green .ki { background: var(--green-soft); color: var(--green); }
.kpi.t-rose .ki { background: var(--red-soft); color: var(--red); }
.kpi.t-amber .ki { background: var(--amber-soft); color: var(--check); }
.kpi.t-sky .ki { background: var(--sky-soft); color: var(--sky); }
.kpi.warn .v { color: var(--red); }
.kpi.flash { animation: kflash 1.6s ease-out; }
@keyframes kflash { 0% { box-shadow: 0 0 0 3px rgba(251, 146, 60, .6), var(--shadow); } 100% { box-shadow: var(--shadow); } }
.trend svg { width: 12px; height: 12px; }
@container office (max-width: 900px) { .kpi .kc { display: none; } .kpi .kb { min-height: 36px; } }
@container office (max-width: 900px) { .kpi .ki { display: none; } .kpi .v { font-size: 25px; } .kpi .tt { display: none; } .kpi .s { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; } .kpis { gap: 10px; } .kpi { padding: 12px; } }

/* Bereichs-Tabs */
.otabs { display: flex; align-items: center; gap: 10px; padding: 0 18px 12px; flex: none; min-width: 0; }
.otabs-in { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-1); min-width: 0; }
.otab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border: 0; background: transparent; color: var(--ink-2); font-weight: 700; font-size: 13.5px; border-radius: 12px; white-space: nowrap; transition: background .18s, color .18s; }
.otab:hover { color: var(--ink); background: var(--surface-3); }
.otab[aria-current="page"] { background: var(--grad); color: #fff; box-shadow: 0 6px 14px -6px rgba(234, 88, 12, .8); }
.otab .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--acc-soft); color: var(--acc-ink); font-size: 11.5px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.otab[aria-current="page"] .cnt { background: rgba(255, 255, 255, .28); color: #fff; }
.otabs .sp { flex: 1; }
.tl-short { display: none; }
.follow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.follow input { width: 17px; height: 17px; accent-color: var(--acc); }
@container office (max-width: 840px) { .otabs .tl-long { display: none; } .otabs .tl-short { display: inline; } }
@container office (max-width: 700px) { .follow { display: none; } }

.oview { flex: 1; min-height: 0; position: relative; padding: 0 18px 18px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }

/* Belegeingang */
.inbox { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; height: 100%; }
@container office (max-width: 900px) { .inbox { grid-template-columns: 280px minmax(0, 1fr); } }
.ilist { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.ilist-h { display: flex; align-items: center; gap: 8px; padding: 14px 16px 4px; }
.ilist-h h2 { margin: 0; font-size: 15px; font-weight: 800; }
.ilist-h .sp { flex: 1; }
.ilist-h small { color: var(--ink-3); font-weight: 600; font-size: 12px; }
.ifilter { display: flex; gap: 6px; padding: 8px 14px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line-2); }
.chip { height: 30px; padding: 0 11px; border-radius: 999px; border: 0; background: var(--surface-3); font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s; }
.chip:hover { background: #E4E7F0; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; }
.iscroll { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; padding: 6px; }
.irow { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; width: 100%; padding: 10px; border: 0; border-radius: 14px; background: transparent; text-align: left; align-items: start; position: relative; transition: background .15s; margin-bottom: 2px; }
.irow:hover { background: var(--surface-2); }
.irow[aria-current="true"] { background: var(--acc-soft); box-shadow: inset 0 0 0 1.5px rgba(234, 88, 12, .35); }
.irow.is-new { animation: rnew 4.5s ease-out; }
@keyframes rnew { 0%, 30% { background: #FFF4E5; } 100% { background: transparent; } }
.thumb { width: 48px; height: 62px; border-radius: 9px; background: var(--surface-3) center/cover no-repeat; box-shadow: 0 0 0 1px var(--line), 0 4px 10px -6px rgba(16, 24, 40, .35); }
.irow .t1 { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 700; font-size: 13.5px; }
.irow .t1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .t2, .irow .t3 { color: var(--ink-3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .t3 { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.newb { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: var(--grad); color: #fff; flex: none; text-transform: uppercase; letter-spacing: .03em; }
.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: none; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.proc { background: var(--sky-soft); color: var(--sky); }
.st.proc::before { animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .25; } }
.st.rev { background: var(--amber-soft); color: var(--check); }
.st.done { background: var(--green-soft); color: var(--green); }
.st.dev { background: var(--red-soft); color: var(--red); }
.st.plan { background: var(--surface-3); color: var(--ink-2); }
.st.onsite { background: var(--acc-soft); color: var(--acc-ink); }
.st.transit { background: var(--violet-soft); color: var(--violet); }
.empty { padding: 30px 20px; color: var(--ink-3); text-align: center; font-size: 13.5px; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.empty .eic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 10px; background: var(--acc-soft); color: var(--acc); }
.empty .eic svg { width: 24px; height: 24px; }

.dpane { overflow-y: auto; min-height: 0; height: 100%; container-type: inline-size; overscroll-behavior: contain; border-radius: var(--r); }
.dwrap { padding: 0 2px 20px; display: flex; flex-direction: column; gap: 14px; max-width: 1100px; }
.dwrap > * { flex: none; }
.dback { display: none; }
.dhead { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; }
.dhead .dic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); flex: none; }
.dhead .dic svg { width: 22px; height: 22px; }
.dhead > div { min-width: 0; flex: 1 1 260px; }
.dhead h2 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
.dhead h2 .num { color: var(--ink-3); font-weight: 600; font-family: var(--f-mono); font-size: 16px; }
.dhead p { margin: 4px 0 0; color: var(--ink-3); font-size: 13px; }
.dhead .sp { display: none; }
.pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pipe li { position: relative; background: var(--surface); border-radius: 16px; padding: 11px 13px 12px; box-shadow: var(--shadow-1); min-width: 0; overflow: hidden; }
.pipe .pn { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; min-width: 0; }
.pipe .pn .nm { line-height: 1.2; }

@container (max-width: 559px) { .dpane .docfig { display: flex; flex-direction: column; align-items: center; } .dpane .docimg { width: min(100%, 340px); } .dpane .docfig figcaption { align-self: stretch; } }
.docfig { margin: 0; background: #1E2230; border-radius: var(--r); overflow: hidden; position: relative; box-shadow: var(--shadow); }

@keyframes scan { from { top: -18%; } to { top: 100%; } }

.fcard, .mcard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }

.legend-low { display: inline-flex; align-items: center; gap: 6px; }

@container (max-width: 779px) { .dpane .frow { grid-template-columns: minmax(0, 1fr) 76px; gap: 3px 10px; padding: 6px 14px; } .dpane .frow label { grid-column: 1 / -1; } }

.conf { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 700; }

.devs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* Transporte */

}

/* Karte */
.mview { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; height: 100%; min-height: 0; }
.mapbox { position: relative; min-height: 0; overflow: hidden; background: #EEF2EE; display: flex; flex-direction: column; border-radius: var(--r); box-shadow: var(--shadow); }
.mapbox svg.map { flex: 1 1 0; min-height: 0; width: 100%; display: block; }
.map .pin { cursor: pointer; }
.map .pin:focus { outline: none; }
.map .pin:focus-visible circle.o { stroke: var(--acc); stroke-width: 6; }
.map .pin.is-new circle.o { animation: pinpulse 1.2s ease-out 3; }

.tour .prog span { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); }
.tour .prog span.d { background: var(--green); }
.tour .prog span.x { background: var(--red); }
.tour .prog span.a { background: var(--acc-2); }
.tour p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
.tour ol { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.tour ol button { display: flex; width: 100%; gap: 8px; align-items: center; border: 0; background: none; padding: 5px 6px; border-radius: 10px; text-align: left; font-size: 12.5px; transition: background .15s; }
.tour ol button:hover { background: var(--surface-2); }

@container office (max-width: 819px) { .mview { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(300px, 58%) minmax(0, 1fr); } }

/* Übersicht / Dashboard */
.dashwrap { height: 100%; overflow-y: auto; overscroll-behavior: contain; margin: 0 -6px; padding: 0 6px 6px; }
.hello { margin-bottom: 14px; }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.dash-top { display: contents; }
.dcard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

.c-8 { grid-column: span 8; } .c-7 { grid-column: span 7; } .c-6 { grid-column: span 6; } .c-5 { grid-column: span 5; } .c-4 { grid-column: span 4; } .c-12 { grid-column: 1 / -1; }

.mini3 span { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.donutrow { display: flex; align-items: center; gap: 16px; }
.donutrow ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0; font-size: 12.5px; }
.donutrow li { display: flex; align-items: center; gap: 8px; min-width: 0; }

.dvx-ring-v { font-family: var(--f-body); font-weight: 800; fill: var(--ink); }

@container office (max-width: 980px) { .dash .c-8, .dash .c-7, .dash .c-5 { grid-column: 1 / -1; } .dash .c-4 { grid-column: span 6; } }
@container office (max-width: 640px) { .dash .dcard { grid-column: 1 / -1 !important; } }

/* Drawer */
.drawer { position: absolute; inset: 0; z-index: 30; display: flex; justify-content: flex-end; }
.drawer .scrim { position: absolute; inset: 0; background: rgba(21, 26, 45, .32); backdrop-filter: blur(2px); animation: fadein .2s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.dpanel { position: relative; width: min(660px, calc(100% - 24px)); height: calc(100% - 24px); margin: 12px; border-radius: 24px; background: var(--bg); box-shadow: var(--shadow-2); display: flex; flex-direction: column; animation: din .22s ease-out; overflow: hidden; }
@keyframes din { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.dph { display: flex; align-items: center; gap: 10px; padding: 16px 18px; background: var(--surface); box-shadow: 0 1px 0 var(--line-2); }
.dph > div:first-child { min-width: 0; }
.dph h2 { margin: 0; font-size: 20px; line-height: 1.15; font-family: var(--f-mono); font-weight: 600; }

.dph .sp { flex: 1; }
.dpb > * { flex: none; }
.dpb { flex: 1; overflow-y: auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin: 0; padding: 4px 0; }
.kv div { padding: 8px 16px; min-width: 0; }

.ptab { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptab th, .ptab td { padding: 8px 16px; border-bottom: 1px solid var(--line-2); text-align: left; }
.ptab th { color: var(--ink-3); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }

.podbox { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.podbox > div { padding: 4px 16px 12px; min-width: 0; }
.sigimg { background: #fff; border: 1.5px dashed #D3D7E2; border-radius: 14px; height: 100px; display: grid; place-items: center; overflow: hidden; }
.sigimg img { max-width: 100%; max-height: 100%; }
.gal { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 16px 16px; }

.log { list-style: none; margin: 0; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.log li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }

/* Toasts */
.toasts { position: absolute; left: 18px; bottom: 18px; z-index: 40; display: flex; flex-direction: column; gap: 8px; max-width: min(460px, calc(100% - 36px)); pointer-events: none; }
.toast { pointer-events: none; display: flex; gap: 10px; align-items: center; background: #151A2D; color: #fff; border-radius: 14px; padding: 11px 12px 11px 14px; box-shadow: var(--shadow-2); font-size: 13.5px; font-weight: 500; animation: tin .2s ease-out; }
.toast.has-btn { pointer-events: auto; }
.toast .sp { flex: 1; }
.toast button { border: 0; background: rgba(255, 255, 255, .14); color: #fff; height: 32px; border-radius: 9px; padding: 0 11px; font-weight: 700; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.toast button svg { width: 15px; height: 15px; }

function renderOffice() {

function exportCsv() {
  const head = EN ? ['Transport', 'Order', 'Type', 'Tour', 'Stop', 'Company', 'Address', 'Time window', 'Driver', 'Status', 'Done at', 'Signed by', 'POD complete', 'Missing', 'Documents', 'Qty ordered', 'Qty per document', 'Delivery note no.', 'Open discrepancies', 'GPS']

  const q = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = trList().map(tr => { const s = stopOf(tr); const p = s.pod; const d = isDone(s);
    return [tr.id, tr.order, kindTxt(s), DRIVERS[s.drv].tour, s.seq, s.name, `${s.street}, ${s.city}`, `${hm(s.from)}-${hm(s.to)}`, DRIVERS[s.drv].name, trState(tr)[1], d ? fT(s.doneAt) : '', p ? p.name : '', d ? (podComplete(s) ? L('ja', 'yes') : L('nein', 'no')) : '', d ? podMissing(s).join(', ') : '', podDocs(s).length, totalQty(tr), tr.written.qty ? tr.written.qty.v : '', tr.written.lsNo ? tr.written.lsNo.v : '', tr.devs.filter(v => v.open).map(v => v.t).join(' | '), p && p.gps ? `${NF5.format(p.gps.lat)} ${NF5.format(p.gps.lon)}` : ''];
  });

}
function printPod(trId) {

<script>

  if (!window.DemoKit) return;
  const host = () => isMobV() ? $('#mTools') : $('#oKit');
  DemoKit.init({
    app: 'pod', accent: '#EA580C', accent2: '#FB923C',
    langMount: host, tourMount: host,
    i18n: I18N,
    tour: {
      welcome: {
        title: { de: 'Proof of Delivery mit KI', en: 'Proof of Delivery with AI' },
        text: {
          de: '<p>In 2 Minuten sehen Sie, wie Fahrer-App und Disposition zusammenspielen.</p><ul><li>Fahrer fotografiert Belege, Unterschrift und GPS inklusive</li><li>KI liest CMR, Lieferscheine und Rechnungen aus und ordnet sie zu</li><li>Das Büro prüft nur Ausnahmen und sieht alle Touren live</li></ul>',

/* ---------- Start ---------- */
async function init() {
  $('#today').textContent = L('Disposition, ', 'Dispatch, ') + new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }).format(D0);
  try { await Promise.all(['500 16px "Plex Mono"', '600 16px "Plex Mono"', '500 30px Caveat', '700 30px Barlow', '600 12px Barlow', '500 12px Barlow'].map(f => document.fonts.load(f))); } catch (e) {}
  S = load();
  if (!S) { S = seed(); seedHistory(); save(); }
  try { const t = localStorage.getItem(KEY + '-tab'); if (t) UI.tab = t; } catch (e) {}
  if (!['dash', 'inbox', 'trs', 'map'].includes(UI.tab)) UI.tab = 'dash';
  if (window.innerWidth >= 760 && window.innerWidth < 1100 && S.phoneOn === undefined) S.phoneOn = true;
  let mv = 'driver'; try { mv = localStorage.getItem(KEY + '-mview') || 'driver'; } catch (e) {}
  setMview(mv);
  // unterbrochene Verarbeitung abschließen
  S.docs.filter(d => d.state === 'processing').forEach(d => runPipeline(d.id, true));
  S.docs.filter(d => d.state === 'sending').forEach(d => deliverDoc(d));
  bindPhone(); bindOffice();
  $('#phoneToggle').addEventListener('click', () => { S.phoneOn = !S.phoneOn; applyLayout(); save(); });
  $('#phoneClose').addEventListener('click', () => { S.phoneOn = false; applyLayout(); save(); $('#phoneToggle').focus(); });
  $('#resetBtn').addEventListener('click', resetDemo);
  $('#mvDriver').addEventListener('click', () => setMview('driver'));
  $('#mvOffice').addEventListener('click', () => setMview('office'));
  let rw = window.innerWidth;
  window.addEventListener('resize', () => { applyLayout(); if ((rw < 760) !== (window.innerWidth < 760)) { rw = window.innerWidth; renderOffice(); } });
  applyLayout(); renderPhone(); renderOffice(); tickClock(); setInterval(tickClock, 20000);
  // ausstehendes Speichern nicht verlieren, wenn die Seite geschlossen oder neu geladen wird
  const flush = () => { if (svT) saveNow(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  initKit();
}
init();
