    <label>${T('Prüfung','Inspection')}<select id="cLot">${lots.map(x=>`<option value="${x.id}" ${x.id===lotId?'selected':''}>${x.id} · ${esc(tx(x.material))} · ${esc(x.charge)}</option>`).join('')}</select></label>
    <div class="opt-g">${Object.entries(CERT).map(([k,c])=>`<label class="opt"><input type="radio" name="cType" value="${k}" ${k==='3.1'?'checked':''}><span><b>${tx(c.t)}</b><small>${tx(c.d)}</small></span></label>`).join('')}</div>
    <div class="two"><label>${T('Kunde','Customer')}<select id="cCust">${CUSTOMERS.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label>${T('Bestell-Nr. Kunde','Customer order no.')}<input id="cOrd" value="4500-${88000+Math.floor(Math.random()*999)}"></label></div>
  </div><div class="card-f"><button class="btn" data-act="close">${T('Abbrechen','Cancel')}</button><button class="btn primary" data-act="newCertSave" ${lots.length?'':'disabled'}>${icon('award')} ${T('Zeugnis erstellen','Create certificate')}</button></div>`);
}

/* ---------- Aktionen ---------- */
const ACT={
  close:closeModal,
  nav:v=>{closeModal();go(v);},
  go:a=>{const [v,id]=a.split(':');closeModal();go(v,id);},
  lang:l=>{lang=l;try{localStorage.setItem('dvx-qm-lang',l);history.replaceState(null,'','#'+l);}catch(e){}closeModal();render(true);},
  more:()=>modal(mHead(T('Mehr','More'))+`<div class="card-b more-list">${NAV.filter(n=>['cat','wf','certs'].includes(n.v)).map(n=>`<button class="nav-i" data-act="nav" data-arg="${n.v}">${icon(n.ic)}<span class="lbl">${tx(n.t)}</span>${icon('right','s')}</button>`).join('')}
    <div class="demo-box" style="margin-top:6px"><b>${T('Live-Demo','Live demo')}</b>${T('Alle Daten sind Beispiele und bleiben in Ihrem Browser.','All data is sample data and stays in your browser.')}<a href="${CONTACT()}" target="_blank" rel="noopener">${T('Für Ihr Unternehmen anpassen →','Tailor it to your company →')}</a></div>
    ${langSw()}<button class="btn" data-act="reset">${icon('reset')} ${T('Demo zurücksetzen','Reset demo')}</button></div>`),
  reset:()=>modal(mHead(T('Demo zurücksetzen?','Reset demo?'))+`<div class="card-b">${T('Alle Ihre Änderungen werden verworfen und die Beispieldaten neu geladen.','All your changes will be discarded and the sample data reloaded.')}</div><div class="card-f"><button class="btn" data-act="close">${T('Abbrechen','Cancel')}</button><button class="btn danger" data-act="resetYes">${T('Zurücksetzen','Reset')}</button></div>`),
  resetYes:()=>{S=seed();save();closeModal();U.plan='PP-1001';U.tpl='8d';U.runLot=null;go('start');toast(T('Demo zurückgesetzt','Demo reset'));},
  // Prüflose
  lotF:v=>{U.lotF=v;render(true);},
  taskTab:v=>{U.taskTab=v;render(true);},
  newLot:a=>newLotModal(a),
  newLotSave:()=>{
    const p=S.plans.find(x=>x.id===val('nlPlan'));if(!p)return;
    const sup=val('nlSup');const id='PR-'+(S.seq.lot++);
    const l={id,planId:p.id,planName:JSON.parse(JSON.stringify(p.name)),material:JSON.parse(JSON.stringify(p.material)),origin:p.origin,supplier:sup,order:sup?'':'FA-'+(55100+Math.floor(Math.random()*99)),charge:val('nlCh')||'–',qty:pNum(val('nlQty'))||1,date:TODAY(),status:'open',ud:null,insp:val('nlIn')||'ak',items:JSON.parse(JSON.stringify(p.items)),res:{},closedAt:null};
    S.lots.unshift(l);save();closeModal();go('lot',id);toast(T('Prüfung angelegt','Inspection created'));
  },
  runGo:k=>{const l=curLot();U.runIdx=Math.max(0,Math.min(Number(k),l.items.length));render();const top=document.getElementById('strip');if(top)top.closest('.card').scrollIntoView({block:'start',behavior:'smooth'});},
  q:v=>{const l=curLot(),it=l.items[U.runIdx];const r=ensureRes(l,it);r.q=r.q===v?null:v;if(l.status==='open')l.status='prog';save();render(true);},
  ud:v=>{U.ud=v;render(true);},
  finish:()=>{
    const l=curLot();if(missing(l).length||!U.ud)return;
    l.status='done';l.ud=U.ud;l.closedAt=TODAY();save();const s=lotSum(l);U.runLot=null;go('lot',l.id);
    if(s.nok)modal(mHead(T('Prüfung abgeschlossen','Inspection completed'))+`<div class="card-b"><div class="critbox">${icon('alert')}<span>${s.nok} ${T('Prüfpunkt(e) n.i.O. Soll direkt eine Reklamation mit Workflow angelegt werden?','checkpoint(s) failed. Create a complaint with workflow right away?')}</span></div></div><div class="card-f"><button class="btn" data-act="close">${T('Später','Later')}</button><button class="btn danger" data-act="newRekla" data-arg="${l.id}">${icon('alert')} ${T('Reklamation anlegen','Create complaint')}</button></div>`);
    else modal(mHead(T('Prüfung abgeschlossen','Inspection completed'))+`<div class="card-b"><div style="display:flex;gap:10px;align-items:center"><span class="pill good" style="font-size:14px;padding:6px 12px">${icon('ok','s')} ${T('Alle Prüfpunkte i.O.','All checkpoints passed')}</span></div><p class="hint" style="margin:0">${T('Erstellen Sie jetzt ein Zeugnis nach EN 10204 – die Messwerte werden automatisch übernommen.','Create an EN 10204 certificate now – the measured values are carried over automatically.')}</p></div><div class="card-f"><button class="btn" data-act="close">${T('Fertig','Done')}</button><button class="btn primary" data-act="newCert" data-arg="${l.id}">${icon('award')} ${T('Zeugnis erstellen','Issue certificate')}</button></div>`);
  },
  photo:a=>{const [lid,u,k]=a.split('|');const l=lotById(lid);const r=l&&l.res[u];if(!r)return;const it=l.items.find(i=>i.uid===u);
    modal(mHead(esc(tx(it.name)),`${l.id} · ${T('Foto','Photo')} ${Number(k)+1}/${r.photos.length}`)+`<div class="card-b"><img class="photo-big" src="${r.photos[k]}" alt=""></div>${l.status!=='done'?`<div class="card-f"><span></span><button class="btn danger" data-act="delPhoto" data-arg="${a}">${icon('trash')} ${T('Foto löschen','Delete photo')}</button></div>`:''}`,true);},
  delPhoto:a=>{const [lid,u,k]=a.split('|');const l=lotById(lid);l.res[u].photos.splice(Number(k),1);save();closeModal();render(true);},
  delDoc:k=>{const l=curLot(),it=l.items[U.runIdx];ensureRes(l,it).docs.splice(Number(k),1);save();render(true);},
  // Prüfpläne
  plan:id=>{U.plan=id;render(true);},
  newPlan:()=>modal(mHead(T('Neuer Prüfplan','New inspection plan'))+`<div class="card-b f"><label>${T('Bezeichnung','Name')}<input id="npName" placeholder="${T('z. B. Wareneingang Flansch F-80','e.g. Incoming inspection flange F-80')}"></label><label>${T('Material','Material')}<input id="npMat" placeholder="${T('z. B. Flansch F-80','e.g. Flange F-80')}"></label><label>${T('Prüfart','Inspection type')}<select id="npOr"><option value="we">${T('Wareneingang','Goods receipt')}</option><option value="fe">${T('Fertigung / Endprüfung','Production / final inspection')}</option></select></label><div class="err" id="npErr"></div></div><div class="card-f"><button class="btn" data-act="close">${T('Abbrechen','Cancel')}</button><button class="btn primary" data-act="newPlanSave">${T('Anlegen','Create')}</button></div>`),
  newPlanSave:()=>{const n=val('npName').trim();if(!n){$('#npErr').textContent=T('Bitte eine Bezeichnung eingeben.','Please enter a name.');return;}
    const id='PP-'+(S.seq.plan++);const m=val('npMat').trim()||n;S.plans.push({id,name:{de:n,en:n},material:{de:m,en:m},origin:val('npOr'),status:'draft',ver:1,items:[]});U.plan=id;save();closeModal();go('plans');toast(T('Prüfplan angelegt – jetzt Prüfpunkte hineinziehen','Plan created – now drag in checkpoints'));},
  addCat:id=>{const p=curPlan(),m=S.catalog.find(x=>x.id===id);const it=itemFrom(m);p.items.push(it);U.flash=it.uid;save();render(true);toast(`${tx(m.name)} ${T('hinzugefügt','added')}`);const el=document.querySelector(`[data-uid="${it.uid}"]`);if(el&&window.matchMedia('(max-width:980px)').matches)el.scrollIntoView({block:'center',behavior:'smooth'});},
  nStep:a=>{const [u,d]=a.split('|');const it=curPlan().items.find(i=>i.uid===u);it.n=Math.max(1,Math.min(50,it.n+Number(d)));save();render(true);},
  togPhoto:u=>{const it=curPlan().items.find(i=>i.uid===u);it.photo=!it.photo;save();render(true);},
  editItem:u=>itemModal(u),
  editItemSave:u=>{const it=curPlan().items.find(i=>i.uid===u);
    if(it.type==='quant'){const s=pNum(val('eiSoll')),lo=pNum(val('eiU')),hi=pNum(val('eiO'));if(lo==null||hi==null||s==null||lo>s||s>hi){$('#eiErr').textContent=T('Bitte beachten: Min. ≤ Soll ≤ Max.','Please ensure min ≤ target ≤ max.');return;}it.soll=s;it.ugw=lo;it.ogw=hi;it.unit=val('eiUnit');}
    it.name={...it.name,[lang]:val('eiName')||tx(it.name)};it.method={...(typeof it.method==='object'?it.method:{de:it.method,en:it.method}),[lang]:val('eiMeth')};it.n=Math.max(1,Math.min(50,parseInt(val('eiN'))||1));it.photo=$('#eiPh').checked;save();closeModal();U.flash=u;render(true);},
  delItem:u=>{const p=curPlan();p.items=p.items.filter(i=>i.uid!==u);save();render(true);},
  relPlan:()=>{const p=curPlan();p.status='rel';save();render(true);toast(T('Prüfplan freigegeben','Plan released'));},
  // Merkmale
  catT:v=>{U.catT=v;render(true);},
  newM:()=>mModal(),
  editM:id=>mModal(id),
  saveM:id=>{
    const type=val('mType'),name=val('mName').trim();if(!name){$('#mErr').textContent=T('Bitte eine Bezeichnung eingeben.','Please enter a name.');return;}
    const o={code:val('mCode').trim()||'NM',name:{de:name,en:name},type,method:{de:val('mMeth'),en:val('mMeth')},photo:$('#mPh').checked};

    if(id){const m=S.catalog.find(x=>x.id===id);const keep={...m.name};Object.assign(m,o);m.name={...keep,[lang]:name};}
    else{S.catalog.push({id:'M'+(S.seq.m++),...o});}

  },
  delM:id=>{if(S.plans.some(p=>p.items.some(i=>i.mid===id))){toast(T('Wird in Prüfplänen verwendet – erst dort entfernen','Used in plans – remove it there first'));return;}S.catalog=S.catalog.filter(m=>m.id!==id);save();render(true);},
  // Reklamationen
  rF:v=>{U.rF=v;render(true);},
  rT:v=>{U.rT=v;render(true);},
  newRekla:a=>reklaModal(a),
  newReklaSave:()=>{

  },
  stepDone:u=>{const x=S.reklas.find(r=>r.id===U.id);const s=x.steps.find(z=>z.uid===u);s.done=true;s.doneAt=TODAY();s.note=val('stepNote').trim();save();render(true);toast(isClosed(x)?T('Reklamation abgeschlossen 🎉','Complaint closed 🎉'):T('Schritt erledigt – nächster Verantwortlicher informiert','Step done – next owner notified'));},
  stepUndo:()=>{const x=S.reklas.find(r=>r.id===U.id);const done=x.steps.filter(z=>z.done);const last=done[done.length-1];if(last){last.done=false;last.doneAt=null;}save();render(true);},
  // Workflows
  tpl:id=>{U.tpl=id;render(true);},
  newTpl:()=>modal(mHead(T('Neue Workflow-Vorlage','New workflow template'))+`<div class="card-b f"><label>${T('Bezeichnung','Name')}<input id="ntName" placeholder="${T('z. B. Reklamation Verpackung','e.g. Packaging complaint')}"></label><div class="err" id="ntErr"></div></div><div class="card-f"><button class="btn" data-act="close">${T('Abbrechen','Cancel')}</button><button class="btn primary" data-act="newTplSave">${T('Anlegen','Create')}</button></div>`),

  addBlk:k=>{const tp=curTpl();const s={uid:uid(),k,role:BLK[k].role,sla:BLK[k].sla};tp.steps.push(s);U.flash=s.uid;save();render(true);toast(`${tx(BLK[k].t)} ${T('hinzugefügt','added')}`);const el=document.querySelector(`[data-uid="${s.uid}"]`);if(el&&window.matchMedia('(max-width:980px)').matches)el.scrollIntoView({block:'center',behavior:'smooth'});},
  delStep:u=>{const tp=curTpl();tp.steps=tp.steps.filter(s=>s.uid!==u);save();render(true);},
  // Zeugnisse
  newCert:a=>certModal(a),
  newCertSave:()=>{const lid=val('cLot');if(!lid)return;const type=(document.querySelector('input[name=cType]:checked')||{}).value||'3.1';const id='Z-2026-'+(S.seq.cert++);
    S.certs.unshift({id,lot:lid,type,customer:val('cCust'),order:val('cOrd'),date:TODAY(),by:'sw'});save();closeModal();go('cert',id);toast(T('Zeugnis erstellt','Certificate created'));},
  pdf:()=>toast(T('PDF-Export und Versand per E-Mail sind in der Vollversion enthalten.','PDF export and email sending are included in the full version.'))
};

/* ---------- Eingaben ---------- */
const IN={
  val:el=>{const l=curLot(),it=l.items[U.runIdx];const r=ensureRes(l,it);const k=Number(el.dataset.k);const v=pNum(el.value);r.vals[k]=v;
    el.classList.toggle('ok',v!=null&&v>=it.ugw&&v<=it.ogw);el.classList.toggle('nok',v!=null&&(v<it.ugw||v>it.ogw));
    if(l.status==='open')l.status='prog';save();live(l,it);},
  note:el=>{const l=curLot(),it=l.items[U.runIdx];ensureRes(l,it).note=el.value;save();},
  photo:async el=>{const l=curLot(),it=l.items[U.runIdx];const r=ensureRes(l,it);const files=[...el.files];if(!files.length)return;
    for(const f of files){const d=await readImg(f);if(d)r.photos.push(d);}if(l.status==='open')l.status='prog';save();render(true);toast(T('Foto gespeichert','Photo saved'));},
  doc:el=>{const l=curLot(),it=l.items[U.runIdx];const r=ensureRes(l,it);[...el.files].forEach(f=>r.docs.push({n:f.name,s:f.size}));save();render(true);toast(T('Dokument angehängt','Document attached'));},
  palq:el=>{const v=el.value.toLowerCase().trim();el.closest('.card').querySelectorAll('.pal').forEach(p=>p.hidden=!!v&&!p.dataset.s.includes(v));},
  catq:el=>{U.catQ=el.value;const pos=el.selectionStart;render(true);const n=document.querySelector('[data-in="catq"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},
  pname:el=>{const p=curPlan();p.name={...p.name,[lang]:el.value};save();},
  mtype:el=>{$('#mQ').hidden=el.value!=='quant';},
  rtype:el=>{const s=$('#rTpl');if(s)s.value=RTYPE[el.value].tpl;const p=$('#rPartner');if(p&&el.value==='intern')p.value='';if(p&&el.value==='kunde')p.value=CUSTOMERS[0];if(p&&el.value==='lief'&&!SUPPLIERS.includes(p.value))p.value=SUPPLIERS[0];},
  srole:el=>{const s=curTpl().steps.find(x=>x.uid===el.dataset.uid);s.role=el.value;save();render(true);},
  ssla:el=>{const s=curTpl().steps.find(x=>x.uid===el.dataset.uid);s.sla=Math.max(1,Math.min(60,parseInt(el.value)||1));save();const h=document.querySelector('.builder .card-h p b');if(h)h.textContent=curTpl().steps.reduce((a,x)=>a+x.sla,0)+' '+T('Tage','days');}
};
function live(l,it){
  const r=l.res[it.uid];const e=evalItem(it,r);
  const st=$('#runState');if(st)st.innerHTML=statePill(e);
  const tol=$('#tol');if(tol)tol.innerHTML=tolSvg(it,r.vals);
  const b=document.querySelector(`.stp[data-arg="${U.runIdx}"]`);if(b){b.classList.remove('ok','nok');if(e)b.classList.add(e);}
  const s=lotSum(l);const pr=$('#runProg');if(pr)pr.textContent=`${s.ok+s.nok} / ${s.total} ${T('erfasst','recorded')}`;
  const bar=$('#runBar');if(bar)bar.innerHTML=`<i class="g" style="width:${s.ok/s.total*100}%"></i><i class="r" style="width:${s.nok/s.total*100}%"></i>`;
}
function readImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const m=1000,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));};img.onerror=()=>res(null);img.src=fr.result;};fr.onerror=()=>res(null);fr.readAsDataURL(file);});}

/* ---------- Drag & Drop (Maus + Touch über Pointer Events) ---------- */
const DnD={st:null,just:false,
  down(e){
    const src=e.target.closest('[data-drag]');if(!src||(e.button&&e.button!==0))return;
    if(e.target.closest('input,select,textarea'))return;
    this.st={src,payload:src.dataset.drag,x:e.clientX,y:e.clientY,id:e.pointerId,active:false};
  },
  move(e){
    const s=this.st;if(!s||e.pointerId!==s.id)return;
    if(!s.active){if(Math.hypot(e.clientX-s.x,e.clientY-s.y)<6)return;this.start(e);}
    e.preventDefault();s.lx=e.clientX;s.ly=e.clientY;this.track();
  },
  start(e){
    const s=this.st;s.active=true;
    const card=s.src.closest('[data-dragcard]')||s.src;const r=card.getBoundingClientRect();
    const g=card.cloneNode(true);g.classList.add('dnd-ghost');g.classList.remove('flash');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
    s.dx=e.clientX-r.left;s.dy=e.clientY-r.top;document.body.appendChild(g);s.ghost=g;s.card=card;
    s.ph=document.createElement('div');s.ph.className='ph';s.ph.style.height=Math.min(r.height,74)+'px';
    if(/^(item|step):/.test(s.payload))card.classList.add('dragging');
    document.body.classList.add('is-dragging');
    s.timer=setInterval(()=>{if(s.ly==null)return;const m=80;if(s.ly<m)window.scrollBy(0,-14);else if(s.ly>innerHeight-m)window.scrollBy(0,14);else return;this.track();},16);
  },
  track(){
    const s=this.st;if(!s)return;
    s.ghost.style.left=(s.lx-s.dx)+'px';s.ghost.style.top=(s.ly-s.dy)+'px';
    const el=document.elementFromPoint(s.lx,s.ly);
    const zone=el&&el.closest('[data-drop]');
    const kind=s.payload.split(':')[0];
    document.querySelectorAll('[data-drop].over').forEach(z=>{if(z!==zone)z.classList.remove('over');});
    if(zone&&zone.dataset.accept.split(',').includes(kind)){
      const kids=[...zone.children].filter(k=>k.hasAttribute('data-dragcard')&&k!==s.card);
      let idx=kids.length;
      for(let i=0;i<kids.length;i++){const r=kids[i].getBoundingClientRect();if(s.ly<r.top+r.height/2){idx=i;break;}}
      s.zone=zone;s.idx=idx;zone.classList.add('over');
      if(idx<kids.length){if(s.ph.nextElementSibling!==kids[idx])zone.insertBefore(s.ph,kids[idx]);}
      else{const lastKid=kids[kids.length-1];if(lastKid){if(lastKid.nextElementSibling!==s.ph)lastKid.after(s.ph);}else if(zone.firstElementChild!==s.ph)zone.prepend(s.ph);}
    }else{s.zone=null;s.ph.remove();}
  },
  up(e){
    const s=this.st;if(!s)return;this.st=null;if(!s.active)return;
    const zone=s.zone,idx=s.idx;this.clean(s);this.just=true;setTimeout(()=>this.just=false,60);
    if(zone)onDrop(zone.dataset.drop,s.payload,idx);
  },
  cancel(){const s=this.st;this.st=null;if(s&&s.active)this.clean(s);},
  clean(s){clearInterval(s.timer);s.ghost&&s.ghost.remove();s.ph&&s.ph.remove();s.card&&s.card.classList.remove('dragging');document.body.classList.remove('is-dragging');document.querySelectorAll('[data-drop].over').forEach(z=>z.classList.remove('over'));}
};
function onDrop(zone,payload,idx){
  const [kind,id]=payload.split(':');
  if(zone==='plan'){const p=curPlan();
    if(kind==='cat'){const m=S.catalog.find(x=>x.id===id);const it=itemFrom(m);p.items.splice(idx,0,it);U.flash=it.uid;toast(`${tx(m.name)} ${T('hinzugefügt','added')}`);}
    else if(kind==='item'){const from=p.items.findIndex(x=>x.uid===id);if(from<0)return;const [it]=p.items.splice(from,1);p.items.splice(idx,0,it);U.flash=it.uid;}
  }
  if(zone==='wf'){const tp=curTpl();
    if(kind==='blk'){const s={uid:uid(),k:id,role:BLK[id].role,sla:BLK[id].sla};tp.steps.splice(idx,0,s);U.flash=s.uid;toast(`${tx(BLK[id].t)} ${T('hinzugefügt','added')}`);}
    else if(kind==='step'){const from=tp.steps.findIndex(x=>x.uid===id);if(from<0)return;const [s]=tp.steps.splice(from,1);tp.steps.splice(idx,0,s);U.flash=s.uid;}
  }
  save();render(true);
}
document.addEventListener('pointerdown',e=>DnD.down(e));
document.addEventListener('pointermove',e=>DnD.move(e),{passive:false});
document.addEventListener('pointerup',e=>DnD.up(e));
document.addEventListener('pointercancel',()=>DnD.cancel());
document.addEventListener('touchmove',e=>{if(DnD.st&&DnD.st.active)e.preventDefault();},{passive:false});
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('[data-drag]'))e.preventDefault();});

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  if(DnD.just){e.preventDefault();return;}
  if(e.target.id==='modal'){closeModal();return;}
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset.arg,a,e);}
});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.in)return;if(el.type==='file'||el.tagName==='SELECT'||el.type==='radio'||el.type==='checkbox')return;IN[el.dataset.in]&&IN[el.dataset.in](el);});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.in)return;if(el.type==='file'||el.tagName==='SELECT'||el.type==='radio'||el.type==='checkbox'||el.type==='number'){IN[el.dataset.in]&&IN[el.dataset.in](el);if(el.type==='file')el.value='';}});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if((h==='en'||h==='de')&&h!==lang){lang=h;render(true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});

render();
})();
</script>
