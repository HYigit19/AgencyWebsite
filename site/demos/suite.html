/* Erinnerungen per E-Mail: eine Mail je Person mit allem, was offen ist */
function reminderMails() {
  const open = allTasks().filter(t => !t.done && !t.dept), by = {};
  open.forEach(t => { (by[t.owner] = by[t.owner] || []).push(t); });
  return Object.entries(by).filter(([, l]) => l.some(isOver)).map(([n, l]) => {
    const p = person(n) || {}, ov = l.filter(isOver).sort((a, b) => a.due.localeCompare(b.due)), rest = l.filter(t => !isOver(t)).sort((a, b) => a.due.localeCompare(b.due));
    const line = t => `- ${t.it.nr}: ${taskLabel(t)} (${L('fällig', 'due')} ${fmt(t.due)})`;
    const fn = n.replace(/^Dr\.\s*/, '').split(' ')[0];
    return { n, email: p.email || '', count: l.length, over: ov.length, subject: L(`Erinnerung: ${ov.length} überfällige ${ov.length === 1 ? 'Aufgabe' : 'Aufgaben'}`, `Reminder: ${ov.length} overdue ${ov.length === 1 ? 'task' : 'tasks'}`),
      body: L(`Hallo ${fn},\n\nbei dir ist Folgendes überfällig:\n${ov.map(line).join('\n')}${rest.length ? `\n\nAußerdem offen:\n${rest.slice(0, 15).map(line).join('\n')}` : ''}\n\nBitte erledigen oder einen neuen Termin mit mir abstimmen.${sig()}`,
        `Hi ${fn},\n\nthe following is overdue on your side:\n${ov.map(line).join('\n')}${rest.length ? `\n\nAlso open:\n${rest.slice(0, 15).map(line).join('\n')}` : ''}\n\nPlease complete it or agree a new date with me.${sig()}`) };
  });
}
function remindMailSheet() {
  const R = reminderMails(), ok = R.filter(x => x.email), no = R.filter(x => !x.email);
  if (!R.length) { toast(L('Niemand hat etwas überfällig.', 'Nobody has anything overdue.')); return; }
  openSheet(`${sheetH(L('Per E-Mail erinnern', 'Remind by email'))}<form id="remF" novalidate><div class="sheet-b">
    <p>${L(`${ok.length} ${ok.length === 1 ? 'E-Mail' : 'E-Mails'}, je Person eine mit allen überfälligen und offenen Aufgaben.`, `${ok.length} ${ok.length === 1 ? 'email' : 'emails'}, one per person with all overdue and open tasks.`)}</p>
    <ul class="mail-l">${ok.map(x => `<li>${av(x.n, 's')}<span><b>${esc(x.n)}</b><small>${esc(x.email)} · ${L(`${x.over} überfällig, ${x.count} offen`, `${x.over} overdue, ${x.count} open`)}</small></span></li>`).join('')}</ul>
    ${no.length ? `<p class="hint">${L(`Ohne E-Mail-Adresse, werden übersprungen: ${no.map(x => esc(x.n)).join(', ')}. Adresse unter Stammdaten → Mitarbeiter ergänzen.`, `No email address, will be skipped: ${no.map(x => esc(x.n)).join(', ')}. Add the address under Master data → Employees.`)}</p>` : ''}
    <details><summary>${L('Vorschau', 'Preview')}</summary><pre class="mail-pre" data-no-i18n>${esc(ok[0] ? `${L('Betreff', 'Subject')}: ${ok[0].subject}\n\n${ok[0].body}` : '')}</pre></details>
    <p class="hint">${canMail() ? L('Versand über Ihr Gmail-Konto.', 'Sent via your Gmail account.') : L('In der Demo werden keine E-Mails versendet. Im echten Betrieb gehen sie über das E-Mail-Konto des Absenders raus.', 'No emails are sent in the demo. In live operation they go out via the sender’s email account.')}</p>
  </div>${foot(canMail() ? L(`${ok.length} senden`, `Send ${ok.length}`) : L('Verstanden', 'Got it'), 'primary')}</form>`, true);
}
async function sendReminders() {
  if (!canMail()) { closeSheet(); return; }
  const R = reminderMails().filter(x => x.email); let ok = 0, fail = 0, lastErr = null;
  closeSheet();
  for (const x of R) {
    toast(L(`Sende ${ok + fail + 1} von ${R.length} …`, `Sending ${ok + fail + 1} of ${R.length} …`));
    try { await sendMail([x.email], x.subject, x.body); ok++; } catch (e) { fail++; lastErr = e; if (e && ['server_not_connected', 'needs_reauth', 'not_granted', 'consent_required', 'blocked_by_policy', 'cancelled'].includes(e.code)) break; }
  }
  if (ok) { R.slice(0, ok).forEach(x => remindOwner(x.n)); commit(L(`${ok} ${ok === 1 ? 'Erinnerung' : 'Erinnerungen'} per E-Mail gesendet${fail ? `, ${fail} fehlgeschlagen` : ''}`, `${ok} ${ok === 1 ? 'reminder' : 'reminders'} sent by email${fail ? `, ${fail} failed` : ''}`)); }
  else toast(mailErr(lastErr));
}
