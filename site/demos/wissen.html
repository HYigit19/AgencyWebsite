/* Wer ist zuständig? */
const WER = { text: '', kind: '', mode: 'list', hash: '' };
function vWer(R) {
  const target = R.params.get('id'); const ptarget = R.params.get('p');
  const matchT = (z, txt) => { const p = person(z.person), d = person(z.deputy); return !txt || fold(`${z.topic} ${kindName(z.kind)} ${p.name} ${p.role} ${d.name} ${dn(p.dept)} ${z.note}`).includes(txt); };
  if (WER.hash !== location.hash) { // Parameter nur beim Aufruf übernehmen, danach gelten die Schalter
    WER.hash = location.hash;
    if (R.params.get('ansicht') === 'org' || ptarget) { WER.mode = 'org'; if (ptarget && WER.text) WER.text = ''; }
    const t = target && S.who.find(z => z.id === target);
    if (t) { WER.mode = 'list'; if ((WER.kind && WER.kind !== t.kind) || !matchT(t, fold(WER.text))) { WER.kind = ''; WER.text = ''; } }
  }
  const f = fold(WER.text);
  const match = z => matchT(z, f);
  const items = S.who.filter(z => (!WER.kind || z.kind === WER.kind) && match(z));
  const kinds = ['Kunde', 'Lieferant', 'Prozess', 'Thema'];

      ${items.map(z => { const p = person(z.person); return `<tr id="z-${esc(z.id)}"${z.id === target ? ' class="target"' : ''}><td><div class="topic">${esc(z.topic)}</div><div class="note">${esc(kindName(z.kind))}${z.note ? `. ${esc(z.note)}` : ''}</div></td><td data-label="${L('Zuständig', 'Responsible')}">${plink(z.person)}<div class="note">${esc(dn(p.dept))}</div></td><td data-label="${L('Vertretung', 'Deputy')}">${plink(z.deputy)}</td><td class="num" data-label="${L('Durchwahl', 'Extension')}"><a href="tel:${esc(p.ext)}">${esc(p.ext)}</a></td><td class="tact">${S.role === 'red' ? `<button type="button" class="btn sm icon quiet" data-act="who-edit" data-id="${esc(z.id)}" aria-label="${L('Zuständigkeit bearbeiten', 'Edit responsibility')}: ${esc(z.topic)}">${ico('edit', 'sm')}</button>` : ''}</td></tr>`; }).join('')}

}

function upRender() {
  if (!UP || !dlg.open || !dlg.querySelector('[data-form="upload"]')) return;
  const bodyEl = dlg.querySelector('.dlg-body'), footEl = dlg.querySelector('.dlg-foot'); if (!bodyEl) return;
  let b = '', f = '';
  if (UP.stage === 'pick') {
    b = `<label class="drop" for="upFile" id="dropZone">${ico('upload', 'lg')}<b>${L('Datei hierher ziehen oder auswählen', 'Drag a file here or choose one')}</b><span class="muted">${L('PDF, DOCX, TXT oder MD, höchstens 30 MB', 'PDF, DOCX, TXT or MD, up to 30 MB')}</span></label>
      <input type="file" id="upFile" class="sr" accept=".pdf,.docx,.txt,.md,.markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown" data-change="up-file">
      ${UP.error ? `<div class="parse-state bad" role="alert">${ico('alert')}<div><b>${esc(UP.errorTitle || L('Datei nicht übernommen', 'File not accepted'))}</b><div>${esc(UP.error)}</div></div></div>` : ''}
      <p class="small muted" style="margin:0">${L('Keine Datei zur Hand?', 'No file to hand?')} <button type="button" class="linkbtn" data-act="up-sample">${L('Beispiel-PDF verwenden', 'Use the sample PDF')}</button> ${L('(Merkblatt Gefahrstofflager, zwei Seiten).', '(hazardous substances fact sheet, two pages).')}</p>`;
    f = `<button type="button" class="btn" data-act="dlg-close">${L('Abbrechen', 'Cancel')}</button>`;
  } else if (UP.stage === 'parsing') {
    const pc = UP.total ? Math.round(UP.done / UP.total * 100) : 15;
    b = `<div class="parse-state" role="status">${ico('doc')}<div style="flex:1"><b>${L('„', '“')}${esc(UP.file.name)}${L('“', '”')}</b><div>${UP.total ? L(`Text wird ausgelesen, Seite ${UP.done} von ${UP.total}`, `Extracting text, page ${UP.done} of ${UP.total}`) : L('Text wird ausgelesen', 'Extracting text')}</div><div class="bar"><i style="width:${pc}%"></i></div></div></div>`;
    f = `<button type="button" class="btn" data-act="dlg-close">${L('Abbrechen', 'Cancel')}</button>`;
  } else {
    const P = UP.parsed;
    const peek = P.sections.flatMap(s => (s.h ? [s.h] : []).concat(s.x.map(p => p.t))).join('\n\n').slice(0, 700);

  'wo-area': el => { WO.area = el.dataset.v; render(true); const b = $(`[data-act="wo-area"][data-v="${WO.area}"]`); b && b.focus(); },
  copy: async el => {
    const v = el.dataset.v; let ok = false;

    if (!ok) { try { const ta = document.createElement('textarea'); ta.value = v; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); el.focus(); } catch (e) { ok = false; } }
    toast(ok ? L(`Pfad kopiert: ${v}`, `Path copied: ${v}`) : L(`Kopieren nicht möglich. Pfad: ${v}`, `Copying not possible. Path: ${v}`));
  },
  'where-edit': el => guard(L('Bearbeiten', 'Editing'), () => whereDlg(el.dataset.id)),

  'who-edit': el => guard(L('Zuständigkeiten pflegen', 'Maintaining responsibilities'), () => whoDlg(el.dataset.id)),
  'who-del': el => { const id = el.dataset.id; const i = S.who.findIndex(x => x.id === id); const [z] = S.who.splice(i, 1); save(); closeDlg(); render(true); toast(L(`„${z.topic}“ entfernt.`, `“${z.topic}” removed.`), { label: L('Rückgängig', 'Undo'), fn: () => { S.who.splice(i, 0, z); save(); render(true); } }); },

let PICK = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;

});
const SUBMIT = {
  ask: f => { const q = f.q.value.trim(); if (!q) { f.q.focus(); return; } MORE_FILTER = ''; go('#/fragen?q=' + encodeURIComponent(q)); },
  topsearch: f => { const q = f.q.value.trim(); if (!q) return; MORE_FILTER = ''; f.q.value = ''; f.q.blur(); go('#/fragen?q=' + encodeURIComponent(q)); },
  upload: f => { if (UP && UP.stage === 'review') upSave(f); },
  'wiki-save': f => {
    if (S.role !== 'red') return guard(L('Speichern', 'Saving'), () => SUBMIT['wiki-save'](f));
    const v = readForm(f);
    if (!v.title) { const e = $('#wTitleErr'); e.textContent = L('Bitte einen Titel eingeben.', 'Please enter a title.'); e.hidden = false; $('#wTitle').setAttribute('aria-invalid', 'true'); $('#wTitle').focus(); return; }
    let slug = f.dataset.slug; const now = new Date().toISOString();
    if (slug) { const w = wikiPage(slug); const cur = wcur(w); if (cur.body === v.body && cur.title === v.title) { go(`#/wiki/${slug}`); toast(L('Keine Änderungen.', 'No changes.')); return; } w.versions.push({ ts: now, by: me().id, note: v.note || L('Inhalt geändert', 'Content changed'), title: v.title, body: v.body }); }
    else { slug = slugify(v.title); let n = 2; while (wikiPage(slug)) slug = slugify(v.title) + '-' + n++; S.wiki.push({ slug, versions: [{ ts: now, by: me().id, note: v.note || L('Seite angelegt', 'Page created'), title: v.title, body: v.body }] }); }
    if (EDIT_FROM_Q) { const l = S.log.find(x => x.id === EDIT_FROM_Q); if (l) { l.answered = true; l.page = slug; } EDIT_FROM_Q = null; }
    save(); go(`#/wiki/${slug}`); toast(L('Gespeichert. Die Seite ist ab sofort durchsuchbar.', 'Saved. The page is searchable straight away.'));
  },
  'who-save': f => {
    const v = readForm(f); let bad = false;
    setErr(f, 'zTopic', v.topic ? '' : L('Bitte ein Thema eingeben.', 'Please enter a topic.')); if (!v.topic) bad = true;
    setErr(f, 'zDeputy', v.deputy === v.person ? L('Die Vertretung muss eine andere Person sein.', 'The deputy must be a different person.') : ''); if (v.deputy === v.person) bad = true;
    if (bad) { (f.querySelector('[aria-invalid="true"]') || f).focus(); return; }
    const id = f.dataset.id;
    const nid = id || 'z' + Date.now().toString(36);
    if (id) Object.assign(S.who.find(x => x.id === id), v); else S.who.unshift({ id: nid, ...v });
    save(); closeDlg(); WER.hash = ''; go('#/wer?id=' + nid); toast(id ? L('Zuständigkeit gespeichert.', 'Responsibility saved.') : L('Zuständigkeit hinzugefügt. Die Suche kennt sie ab sofort.', 'Responsibility added. The search knows it straight away.'));
  },
  'where-save': f => {
    const v = readForm(f); let bad = false;
    setErr(f, 'oTopic', v.topic ? '' : L('Bitte ein Thema eingeben.', 'Please enter a topic.')); if (!v.topic) bad = true;
    setErr(f, 'oPlace', v.place ? '' : L('Bitte den Ablageort eingeben.', 'Please enter the location.')); if (!v.place) bad = true;
    if (bad) { (f.querySelector('[aria-invalid="true"]') || f).focus(); return; }
    const id = f.dataset.id;
    const nid = id || 'o' + Date.now().toString(36);
    if (id) Object.assign(S.where.find(x => x.id === id), v); else S.where.push({ id: nid, ...v });
    save(); closeDlg(); WO.hash = ''; go('#/wo?id=' + nid); toast(id ? L('Eintrag gespeichert.', 'Entry saved.') : L('Eintrag hinzugefügt. Die Suche kennt ihn ab sofort.', 'Entry added. The search knows it straight away.'));
  },
  'meta-save': f => {
    const v = readForm(f);
    if (!v.title) { setErr(f, 'mTitle', L('Bitte einen Titel eingeben.', 'Please enter a title.')); f.querySelector('#mTitle').focus(); return; }
    const id = f.dataset.id; const patch = { title: v.title, dept: v.dept, type: v.type, version: v.version || '1.0', tags: v.tags.split(',').map(t => t.trim()).filter(Boolean).slice(0, 8), updated: new Date().toISOString() };
    const u = S.userDocs.find(x => x.id === id);
    if (u) Object.assign(u, patch); else S.docMeta[id] = { ...(S.docMeta[id] || {}), ...patch };
    save(); closeDlg(); render(true); toast(L('Eigenschaften gespeichert.', 'Properties saved.'));
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = SUBMIT[f.dataset.form]; fn && fn(f); });
let inT = null;
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'pick') { const f = fold(el.value); $$('#pickList li').forEach(li => { li.hidden = f && !li.dataset.f.includes(f); }); return; }
  clearTimeout(inT);
  inT = setTimeout(() => {
    const pos = el.selectionStart;
    if (k === 'lib-text') LIB.text = el.value; if (k === 'wo-text') WO.text = el.value; if (k === 'wer-text') WER.text = el.value;
    render(true);
    const n = $('#' + el.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* search */ } }
    if (k === 'lib-text') announce($('#libCount') ? $('#libCount').textContent : '');

});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.change; if (!k) return;
  if (k === 'lib-sel') { LIB[el.dataset.k] = el.value; render(true); const n = $('#' + el.id); n && n.focus(); }
  if (k === 'lib-sort') { LIB.sort = el.value; render(true); $('#libSort').focus(); }
  if (k === 'up-file') { const file = el.files && el.files[0]; if (file) upHandle(file); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !/input|textarea|select/i.test(document.activeElement.tagName) && !dlg.open && !document.documentElement.classList.contains('dvx-tour-on')) {
    const i = $('#q-page') || $('#q-home') || $('#topQ'); if (i && i.offsetParent !== null) { e.preventDefault(); i.focus(); }
    else if ($('#topQ').offsetParent) { e.preventDefault(); $('#topQ').focus(); }
  }
});
addEventListener('hashchange', () => { MORE_FILTER = ''; if (dlg.open) closeDlg(); render(); });
addEventListener('scroll', () => { $('#top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
addEventListener('storage', e => { if (e.key === KEY) { const n = store.get(); if (n) { S = n; IDX.dirty = true; render(true); } } });

if (!location.hash) history.replaceState(null, '', '#/start' + '');
save();
render();
